<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchNext: Movie & TV Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Animations */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse-heart {
            0% { transform: scale(1); opacity: 0; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        .animate-fade-in-up { animation: fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        .animate-heart { animation: pulse-heart 0.8s ease-out forwards; }
        
        /* Utility */
        .hidden { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Dynamic Background */
        #dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.25);
            transition: background-image 1s ease-in-out;
        }
        #dynamic-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(to bottom, rgba(2,6,23,0.7), rgba(2,6,23,0.95));
        }

        /* Aspect Ratio for Iframe */
        .aspect-video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .aspect-video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 font-sans selection:bg-rose-500/30 flex flex-col relative overflow-x-hidden">

    <!-- Dynamic Background Elements -->
    <div id="dynamic-bg"></div>
    <div id="dynamic-bg-overlay"></div>

    <!-- Canvas for Confetti -->
    <canvas id="confetti" class="fixed inset-0 pointer-events-none z-[60]"></canvas>

    <!-- Header -->
    <header class="p-4 md:p-6 border-b border-slate-800/50 bg-slate-900/40 backdrop-blur-md sticky top-0 z-50">
        <div class="container mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- Clickable Logo (Home Button) -->
            <button id="logoBtn" class="flex items-center gap-3 group focus:outline-none">
                <div class="p-2 bg-rose-600 rounded-lg shadow-lg shadow-rose-600/20 group-hover:scale-110 transition-transform">
                    <i data-lucide="clapperboard" class="text-white w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-white hidden sm:block group-hover:text-rose-100 transition-colors">
                    Watch<span class="text-rose-500">Next</span>
                </h1>
            </button>
            
            <!-- Media Type Toggle -->
            <div class="flex items-center bg-slate-900/80 p-1 rounded-xl border border-slate-700/50 shadow-inner">
                <button id="modeMovie" class="px-6 py-2 rounded-lg text-sm font-bold transition-all bg-rose-600 text-white shadow-lg">Movies</button>
                <button id="modeTV" class="px-6 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all">TV Series</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex flex-col items-center min-h-[70vh] justify-center relative flex-grow">
        
        <!-- Error Notification -->
        <div id="errorToast" class="hidden absolute top-0 bg-red-500/10 border border-red-500/50 text-red-200 px-6 py-4 rounded-xl items-center gap-3 mb-8 animate-fade-in max-w-lg z-40 backdrop-blur-md">
            <i data-lucide="alert-circle" class="flex-shrink-0"></i>
            <p id="errorText">Error message here</p>
            <button onclick="document.getElementById('errorToast').classList.add('hidden')" class="ml-auto hover:text-white">✕</button>
        </div>

        <!-- VIEW 1: Filters & Genre Selection -->
        <div id="genreSelectionView" class="w-full max-w-5xl animate-fade-in flex flex-col items-center">
            
            <div class="text-center mb-8 space-y-3">
                <h2 class="text-3xl md:text-5xl font-bold text-white">Find your next obsession.</h2>
                <p id="modeDescription" class="text-slate-400 text-lg">Browsing Movies</p>
            </div>

            <!-- Advanced Filters -->
            <div class="w-full grid grid-cols-2 md:grid-cols-4 gap-3 mb-8 max-w-4xl bg-slate-900/60 p-4 rounded-2xl border border-slate-800/50 backdrop-blur-sm shadow-xl">
                <!-- Decade Filter -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Era</label>
                    <div class="relative">
                        <select id="decadeFilter" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 text-sm appearance-none focus:ring-2 focus:ring-rose-500 outline-none transition-all cursor-pointer hover:bg-slate-750">
                            <option value="">Any Time</option>
                            <option value="2024">New (2024-25)</option>
                            <option value="2020">2020s</option>
                            <option value="2010">2010s</option>
                            <option value="2000">2000s</option>
                            <option value="1990">90s Classics</option>
                            <option value="1980">80s Retro</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-3 w-4 h-4 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Language Filter -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Language</label>
                    <div class="relative">
                        <select id="languageFilter" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 text-sm appearance-none focus:ring-2 focus:ring-rose-500 outline-none transition-all cursor-pointer hover:bg-slate-750">
                            <option value="en">English</option>
                            <option value="hi">Hindi</option>
                            <option value="kn">Kannada</option>
                            <option value="ta">Tamil</option>
                            <option value="te">Telugu</option>
                            <option value="ml">Malayalam</option>
                            <option value="ko">Korean</option>
                            <option value="ja">Japanese</option>
                            <option value="">All</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-3 w-4 h-4 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Rating Filter -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Quality</label>
                    <div class="relative">
                        <select id="ratingFilter" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 text-sm appearance-none focus:ring-2 focus:ring-rose-500 outline-none transition-all cursor-pointer hover:bg-slate-750">
                            <option value="7">Good (7+)</option>
                            <option value="8">Great (8+)</option>
                            <option value="5">Any</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-3 w-4 h-4 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Sort Filter -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Sort By</label>
                    <div class="relative">
                        <select id="sortFilter" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 text-sm appearance-none focus:ring-2 focus:ring-rose-500 outline-none transition-all cursor-pointer hover:bg-slate-750">
                            <option value="popularity.desc">Popularity</option>
                            <option value="vote_average.desc">Top Rated</option>
                            <option value="revenue.desc">Box Office</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-3 w-4 h-4 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
            </div>

            <!-- Surprise Me Button -->
            <button id="surpriseBtn" class="mb-10 px-8 py-3 bg-gradient-to-r from-purple-600 to-rose-600 rounded-full font-bold text-white shadow-lg hover:shadow-purple-500/30 hover:scale-105 transition-all flex items-center gap-2">
                <i data-lucide="sparkles" class="w-5 h-5"></i> Surprise Me!
            </button>

            <!-- Genre Grid -->
            <div id="genreGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 w-full pb-8">
                <!-- Genres injected via JS -->
            </div>
        </div>

        <!-- VIEW 2: Loading -->
        <div id="loadingView" class="hidden text-center space-y-8">
            <div class="relative w-32 h-32 mx-auto">
               <div class="absolute inset-0 rounded-full border-4 border-slate-800"></div>
               <div class="absolute inset-0 rounded-full border-t-4 border-rose-600 animate-spin"></div>
               <div class="absolute inset-0 flex items-center justify-center">
                 <i data-lucide="loader-2" class="text-rose-500 w-12 h-12 animate-spin-slow"></i>
               </div>
            </div>
            <h3 id="loadingText" class="text-2xl font-medium text-slate-300">Searching...</h3>
            <p id="loadingSubtext" class="text-slate-500">Scanning databases...</p>
        </div>

        <!-- VIEW 3: Result -->
        <div id="resultView" class="hidden w-full flex flex-col items-center space-y-6 max-w-6xl pb-12">
            <div class="text-center space-y-2">
                <p id="resultGenreLabel" class="text-slate-400 uppercase tracking-widest text-xs font-bold shadow-black drop-shadow-md">Your Pick</p>
                <h2 class="text-3xl md:text-4xl font-black text-white drop-shadow-lg">Watch this now!</h2>
            </div>
            
            <!-- Main Content Area -->
            <div id="swipeCard" class="flex flex-col md:flex-row bg-slate-900/80 backdrop-blur-xl rounded-3xl overflow-hidden shadow-2xl border border-slate-700/50 animate-fade-in-up w-full relative group min-h-[500px]">
                
                <!-- Like Animation Overlay -->
                <div id="likeAnimation" class="absolute inset-0 pointer-events-none flex items-center justify-center z-50 opacity-0">
                    <i data-lucide="heart" class="w-48 h-48 text-rose-500 fill-rose-500 drop-shadow-2xl"></i>
                </div>

                <!-- POSTER SECTION (Permanent Left Side) -->
                <div class="w-full md:w-2/5 lg:w-5/12 relative bg-slate-950 flex-shrink-0">
                    <div id="mediaContainer" class="w-full h-full relative">
                        <!-- Poster injected here -->
                    </div>
                </div>

                <!-- DETAILS SECTION (Right Side) -->
                <div class="w-full md:w-3/5 lg:w-7/12 p-6 md:p-8 flex flex-col gap-6 relative max-h-[850px] overflow-y-auto no-scrollbar">
                    
                    <!-- Header Info -->
                    <div>
                        <h2 id="movieTitle" class="text-2xl md:text-4xl font-bold text-white leading-tight mb-2">Title</h2>
                        <p id="movieTagline" class="text-rose-400 text-sm font-medium italic mb-3 opacity-90"></p>
                        
                        <div class="flex flex-wrap items-center gap-3">
                            <div class="bg-yellow-500 text-black px-3 py-1 rounded-full font-bold flex items-center gap-1 text-sm shadow-lg shadow-yellow-500/20">
                                <i data-lucide="star" class="w-4 h-4 fill-current"></i> <span id="movieRating">0.0</span>
                            </div>
                            <span class="text-slate-400 text-sm px-2 border-r border-slate-700" id="movieYear">0000</span>
                            <span class="text-slate-400 text-sm px-2 border-r border-slate-700 uppercase" id="movieLang">EN</span>
                            <span class="text-slate-400 text-sm px-2" id="movieOrigin">Origin</span>
                        </div>
                    </div>

                    <!-- Plot -->
                    <p id="moviePlot" class="text-slate-300 text-base leading-relaxed font-light">
                        Plot summary...
                    </p>
                    
                    <!-- TRAILER EMBED (New: Embedded in Details) -->
                    <div id="trailerSection" class="hidden w-full">
                        <div class="aspect-video-container bg-black rounded-xl overflow-hidden shadow-lg border border-slate-800">
                             <!-- Iframe injected here -->
                        </div>
                    </div>

                    <!-- Providers Section (Interactive) -->
                    <div id="providersSection" class="hidden">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Where to Watch</h4>
                        <div id="providerIcons" class="flex flex-wrap gap-3">
                            <!-- Clickable Icons injected here -->
                        </div>
                        <div class="mt-2 text-[10px] text-slate-600 italic">Streaming data via JustWatch</div>
                    </div>

                    <!-- Cast (Interactive) -->
                    <div>
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Starring</h4>
                        <div id="movieCast" class="flex flex-wrap gap-4">
                            <!-- Cast with images injected here -->
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="grid grid-cols-3 gap-3 mt-auto pt-6 border-t border-slate-800 sticky bottom-0 bg-slate-900/95 backdrop-blur-sm pb-2 z-10">
                        <a id="watchLink" href="#" target="_blank" class="col-span-1 flex items-center justify-center gap-2 px-3 py-3 bg-yellow-500 hover:bg-yellow-400 text-black rounded-xl font-bold transition-all text-sm shadow-lg shadow-yellow-500/10">
                            <i data-lucide="tv" class="w-4 h-4"></i> Stream
                        </a>
                        <button id="shareBtn" class="col-span-1 flex items-center justify-center gap-2 px-3 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl font-medium transition-all text-sm">
                            <i data-lucide="share-2" class="w-4 h-4"></i> Share
                        </button>
                        <a id="tmdbLink" href="#" target="_blank" class="col-span-1 flex items-center justify-center gap-2 px-3 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl font-medium transition-all text-sm">
                            <i data-lucide="info" class="w-4 h-4"></i> Info
                        </a>
                    </div>
                </div>
            </div>

            <!-- Mobile Swipe Hint -->
            <div class="flex items-center justify-between w-full max-w-sm text-slate-500 text-sm md:hidden animate-pulse px-4">
                <span class="flex items-center gap-1"><i data-lucide="arrow-left" class="w-4 h-4"></i> Reject</span>
                <span class="flex items-center gap-1">Like <i data-lucide="arrow-right" class="w-4 h-4"></i></span>
            </div>

            <button id="resetBtn" class="bg-slate-800/80 hover:bg-rose-600 text-white px-8 py-3 rounded-full font-bold transition-all flex items-center gap-2 backdrop-blur-md shadow-lg hover:shadow-rose-600/20 border border-slate-700 hover:border-transparent">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i> Pick Another
            </button>
        </div>

    </main>

    <footer class="p-8 text-center border-t border-slate-800/50 bg-slate-900/60 backdrop-blur-md mt-auto">
        <p class="text-slate-500 font-medium">Arnav Dugad © 2025</p>
        <p class="text-xs text-slate-600 mt-2">Data provided by TMDB.</p>
    </footer>

    <script>
        // --- CONSTANTS & CONFIG ---
        const TMDB_API_BASE_URL = "https://api.themoviedb.org/3";
        const TMDB_IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w1280"; 
        const TMDB_POSTER_BASE_URL = "https://image.tmdb.org/t/p/w780";
        const TMDB_PROFILE_BASE_URL = "https://image.tmdb.org/t/p/w185";
        const API_KEY = "2b834d5234781ad70bd646922e9ddd18";

        // Sound Effect
        const popSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-modern-technology-select-3124.mp3");

        const MOVIE_GENRES = {
            'Action': { id: 28, icon: 'sword' },
            'Comedy': { id: 35, icon: 'smile' },
            'Drama': { id: 18, icon: 'drama' },
            'Sci-Fi': { id: 878, icon: 'rocket' },
            'Horror': { id: 27, icon: 'ghost' }, 
            'Romance': { id: 10749, icon: 'heart' },
            'Thriller': { id: 53, icon: 'eye' },
            'Animation': { id: 16, icon: 'palette' },
            'Adventure': { id: 12, icon: 'map' },
            'Fantasy': { id: 14, icon: 'wand' }
        };

        const TV_GENRES = {
            'Action & Adv': { id: 10759, icon: 'sword' },
            'Comedy': { id: 35, icon: 'smile' },
            'Drama': { id: 18, icon: 'drama' },
            'Sci-Fi & Fantasy': { id: 10765, icon: 'rocket' },
            'Mystery': { id: 9648, icon: 'search' },
            'Animation': { id: 16, icon: 'palette' },
            'Reality': { id: 10764, icon: 'video' },
            'Documentary': { id: 99, icon: 'book' },
            'Crime': { id: 80, icon: 'siren' },
            'Kids': { id: 10762, icon: 'baby' }
        };

        // --- STATE ---
        let currentMode = 'movie'; 
        let selectedGenre = null;
        let currentContent = null;

        // --- DOM ELEMENTS ---
        const views = {
            selection: document.getElementById('genreSelectionView'),
            loading: document.getElementById('loadingView'),
            result: document.getElementById('resultView')
        };
        const dynamicBg = document.getElementById('dynamic-bg');
        
        // --- INITIALIZATION ---
        function init() {
            renderGenreButtons();
            lucide.createIcons();
            
            // Event Listeners
            document.getElementById('resetBtn').addEventListener('click', resetApp);
            document.getElementById('logoBtn').addEventListener('click', resetApp);
            document.getElementById('shareBtn').addEventListener('click', shareContent);
            document.getElementById('surpriseBtn').addEventListener('click', surpriseMe);
            
            document.getElementById('modeMovie').addEventListener('click', () => setMode('movie'));
            document.getElementById('modeTV').addEventListener('click', () => setMode('tv'));

            setupSwipeGestures();
            
            // Initial animation of bg
            dynamicBg.style.backgroundImage = 'url("https://image.tmdb.org/t/p/w1280/1E5baAaEse26fej7uHcjOgEE2t2.jpg")';
        }

        function setMode(mode) {
            currentMode = mode;
            const btnMovie = document.getElementById('modeMovie');
            const btnTV = document.getElementById('modeTV');
            const desc = document.getElementById('modeDescription');

            if (mode === 'movie') {
                btnMovie.className = "px-6 py-2 rounded-lg text-sm font-bold transition-all bg-rose-600 text-white shadow-lg";
                btnTV.className = "px-6 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all";
                desc.textContent = "Browsing Movies";
            } else {
                btnTV.className = "px-6 py-2 rounded-lg text-sm font-bold transition-all bg-rose-600 text-white shadow-lg";
                btnMovie.className = "px-6 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all";
                desc.textContent = "Browsing TV Series";
            }
            renderGenreButtons();
            lucide.createIcons();
        }

        function resetApp() {
            switchView('selection');
            selectedGenre = null;
            document.getElementById('mediaContainer').innerHTML = ''; // Clear poster
            document.querySelector('#trailerSection .aspect-video-container').innerHTML = ''; // Stop video
            dynamicBg.style.backgroundImage = 'none';
        }

        function renderGenreButtons() {
            const grid = document.getElementById('genreGrid');
            grid.innerHTML = '';
            
            const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;

            Object.keys(GENRES).forEach(genre => {
                const btn = document.createElement('button');
                btn.className = "relative overflow-hidden group p-4 h-28 rounded-2xl transition-all duration-300 transform hover:scale-105 active:scale-95 flex flex-col items-center justify-center gap-2 shadow-lg bg-slate-800 border border-slate-700/50 text-slate-200 hover:bg-slate-700 hover:border-rose-500/50 hover:shadow-rose-500/20";
                
                let iconHtml = '';
                if (genre.includes('Horror')) iconHtml = '<div class="text-3xl z-10 mb-1 filter drop-shadow-lg">👻</div>';
                else if (genre.includes('Romance')) iconHtml = '<div class="text-3xl z-10 mb-1 filter drop-shadow-lg">❤️</div>';
                else if (genre.includes('Sci-Fi')) iconHtml = '<div class="text-3xl z-10 mb-1 filter drop-shadow-lg">👽</div>';
                else if (genre.includes('Comedy')) iconHtml = '<div class="text-3xl z-10 mb-1 filter drop-shadow-lg">😂</div>';
                else iconHtml = `<i data-lucide="${GENRES[genre].icon}" class="w-8 h-8 z-10 mb-1 opacity-80 group-hover:opacity-100 transition-opacity text-rose-500"></i>`;

                btn.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    ${iconHtml}
                    <span class="font-bold text-xs md:text-sm tracking-wide z-10">${genre}</span>
                `;

                btn.onclick = () => handleGenreSelect(genre);
                grid.appendChild(btn);
            });
        }

        function switchView(viewName) {
            Object.values(views).forEach(el => el.classList.add('hidden'));
            views[viewName].classList.remove('hidden');
            if(viewName === 'result') {
                 setTimeout(() => lucide.createIcons(), 50);
            }
        }

        function surpriseMe() {
            popSound.play().catch(e => console.log('Audio blocked'));
            fireConfetti();
            const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;
            const keys = Object.keys(GENRES);
            const randomGenre = keys[Math.floor(Math.random() * keys.length)];
            
            document.getElementById('languageFilter').value = '';
            document.getElementById('decadeFilter').value = '';
            
            handleGenreSelect(randomGenre);
        }

        async function handleGenreSelect(genre) {
            selectedGenre = genre;
            switchView('loading');
            document.getElementById('errorToast').classList.add('hidden');

            const loadingPhrases = ["Scanning database...", "Checking popularity...", "Finding best trailers...", "Loading visuals..."];
            let i = 0;
            const loadingTextEl = document.getElementById('loadingText');
            document.getElementById('loadingSubtext').textContent = currentMode === 'movie' ? 'Searching Movies...' : 'Searching TV Series...';
            
            const textInterval = setInterval(() => {
                loadingTextEl.textContent = loadingPhrases[i % loadingPhrases.length];
                i++;
            }, 600);

            try {
                const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;
                const genreId = GENRES[genre].id;

                const basicData = await fetchContentFromTMDB(genreId);
                const detailedData = await getContentDetails(basicData.id);
                
                const fullData = { ...basicData, ...detailedData };
                currentContent = fullData;

                clearInterval(textInterval);
                displayResult(fullData);

                if(document.activeElement.id === 'surpriseBtn') fireConfetti();

            } catch (err) {
                clearInterval(textInterval);
                console.error(err);
                showError("No content found matching these filters. Try broadening your search!");
                switchView('selection');
            }
        }

        async function fetchContentFromTMDB(genreId) {
            const endpoint = currentMode === 'movie' ? 'discover/movie' : 'discover/tv';
            
            const decade = document.getElementById('decadeFilter').value;
            const lang = document.getElementById('languageFilter').value;
            const rating = document.getElementById('ratingFilter').value || '6';
            const sortBy = document.getElementById('sortFilter').value;

            let params = `&with_genres=${genreId}&vote_average.gte=${rating}&sort_by=${sortBy}`;
            if (lang) params += `&with_original_language=${lang}`;
            
            if (decade) {
                const dateField = currentMode === 'movie' ? 'primary_release_date' : 'first_air_date';
                if (decade === '2024') {
                    params += `&${dateField}.gte=2024-01-01`;
                } else if (decade === 'old') {
                    params += `&${dateField}.lte=1979-12-31`;
                } else {
                    params += `&${dateField}.gte=${decade}-01-01&${dateField}.lte=${parseInt(decade)+9}-12-31`;
                }
            }

            const randomPage = Math.floor(Math.random() * 10) + 1;
            const url = `${TMDB_API_BASE_URL}/${endpoint}?api_key=${API_KEY}&vote_count.gte=50&page=${randomPage}&include_adult=false${params}`;
            
            const response = await fetch(url);
            const data = await response.json();
            
            if (!data.results || data.results.length === 0) throw new Error("No content found");
            
            const randomItem = data.results[Math.floor(Math.random() * data.results.length)];
            return randomItem;
        }

        async function getContentDetails(id) {
            const endpoint = currentMode === 'movie' ? 'movie' : 'tv';
            const url = `${TMDB_API_BASE_URL}/${endpoint}/${id}?api_key=${API_KEY}&append_to_response=credits,videos,watch/providers`;
            const response = await fetch(url);
            return await response.json();
        }

        function displayResult(item) {
            const title = item.title || item.name;
            const date = item.release_date || item.first_air_date;
            const year = date ? date.split('-')[0] : 'N/A';
            const origin = item.origin_country ? item.origin_country[0] : (item.original_language || 'EN').toUpperCase();
            
            document.getElementById('resultGenreLabel').textContent = `${currentMode === 'movie' ? 'Movie' : 'TV Series'} • ${selectedGenre}`;
            document.getElementById('movieTitle').textContent = title;
            document.getElementById('movieTagline').textContent = item.tagline ? `"${item.tagline}"` : '';
            document.getElementById('movieRating').textContent = item.vote_average.toFixed(1);
            document.getElementById('movieYear').textContent = year;
            document.getElementById('movieLang').textContent = item.original_language.toUpperCase();
            document.getElementById('movieOrigin').textContent = origin;
            document.getElementById('moviePlot').textContent = item.overview || "No description available.";

            // --- MEDIA VISUALS ---
            const mediaContainer = document.getElementById('mediaContainer');
            // Background
            if (item.poster_path) {
                dynamicBg.style.backgroundImage = `url('${TMDB_IMAGE_BASE_URL}${item.poster_path}')`;
                mediaContainer.innerHTML = `<img src="${TMDB_POSTER_BASE_URL}${item.poster_path}" alt="${title}" class="w-full h-full object-cover">`;
            } else {
                 mediaContainer.innerHTML = `<div class="w-full h-full bg-slate-900 flex items-center justify-center text-slate-500"><i data-lucide="image-off" class="w-12 h-12"></i></div>`;
            }

            // --- TRAILER EMBED ---
            const trailerSection = document.getElementById('trailerSection');
            const trailerContainer = trailerSection.querySelector('.aspect-video-container');
            const trailer = item.videos?.results?.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
            
            if (trailer) {
                trailerSection.classList.remove('hidden');
                trailerContainer.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${trailer.key}?controls=1&modestbranding=1&rel=0" 
                        title="YouTube video player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                `;
            } else {
                trailerSection.classList.add('hidden');
                trailerContainer.innerHTML = '';
            }

            // --- PROVIDERS (Interactive) ---
            const providersSection = document.getElementById('providersSection');
            const providerIcons = document.getElementById('providerIcons');
            providerIcons.innerHTML = '';
            
            const providers = item['watch/providers']?.results;
            const locale = providers?.['IN'] || providers?.['US'];
            
            if (locale && (locale.flatrate || locale.buy || locale.rent)) {
                providersSection.classList.remove('hidden');
                const link = locale.link; // TMDB Attribution Link
                
                const uniqueProviders = new Map();
                ['flatrate', 'rent', 'buy'].forEach(type => {
                    if (locale[type]) {
                        locale[type].forEach(p => {
                            if (!uniqueProviders.has(p.provider_id)) {
                                uniqueProviders.set(p.provider_id, p);
                            }
                        });
                    }
                });

                Array.from(uniqueProviders.values()).slice(0, 5).forEach(p => {
                    const a = document.createElement('a');
                    a.href = link;
                    a.target = "_blank";
                    a.className = "transform hover:scale-110 transition-transform";
                    
                    a.innerHTML = `
                        <img src="https://image.tmdb.org/t/p/original${p.logo_path}" class="w-10 h-10 rounded-lg shadow-md border border-slate-700/50" title="Watch on ${p.provider_name}">
                    `;
                    providerIcons.appendChild(a);
                });
            } else {
                providersSection.classList.add('hidden');
            }

            // --- CAST (Interactive) ---
            const castContainer = document.getElementById('movieCast');
            castContainer.innerHTML = '';
            const topCast = item.credits?.cast?.slice(0, 6) || [];
            
            topCast.forEach(actor => {
                const a = document.createElement('a');
                a.href = `https://www.google.com/search?q=${encodeURIComponent(actor.name + " actor")}`;
                a.target = "_blank";
                a.className = "flex flex-col items-center gap-1 w-16 text-center group/actor";
                
                const imgUrl = actor.profile_path 
                    ? `${TMDB_PROFILE_BASE_URL}${actor.profile_path}`
                    : 'https://via.placeholder.com/150/334155/FFFFFF?text=?'; 
                
                a.innerHTML = `
                    <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-slate-700 shadow-md group-hover/actor:border-rose-500 transition-colors">
                        <img src="${imgUrl}" class="w-full h-full object-cover group-hover/actor:scale-110 transition-transform duration-500">
                    </div>
                    <span class="text-[10px] leading-tight text-slate-400 font-medium truncate w-full group-hover/actor:text-white">${actor.name}</span>
                `;
                castContainer.appendChild(a);
            });

            // Links
            const typeParam = currentMode === 'movie' ? 'movie' : 'tv';
            document.getElementById('watchLink').href = `https://www.justwatch.com/in/search?q=${encodeURIComponent(title)}`;
            document.getElementById('tmdbLink').href = `https://www.themoviedb.org/${typeParam}/${item.id}`;

            switchView('result');
        }

        // --- UTILS ---
        function shareContent() {
            if (!currentContent) return;
            const title = currentContent.title || currentContent.name;
            const text = `Check out "${title}"! Found it on WatchNext 🍿`;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('shareBtn');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-green-400"></i> Copied!`;
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    lucide.createIcons();
                }, 2000);
            });
        }

        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorToast').classList.remove('hidden');
        }

        // --- SWIPE GESTURES ---
        function setupSwipeGestures() {
            const card = document.getElementById('swipeCard');
            let touchStartX = 0;
            let touchEndX = 0;

            card.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            });

            card.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                if (Math.abs(touchEndX - touchStartX) > 70) {
                    if (touchEndX < touchStartX) resetApp(); // Left swipe
                    else { // Right swipe
                        const heart = document.getElementById('likeAnimation');
                        heart.classList.remove('animate-heart');
                        void heart.offsetWidth;
                        heart.classList.add('animate-heart');
                        popSound.play().catch(e => {}); // subtle sound on like
                        shareContent();
                    }
                }
            });
        }

        // --- CONFETTI ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            for(let i=0; i<100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    color: `hsl(${Math.random() * 360}, 70%, 50%)`,
                    size: Math.random() * 5 + 2,
                    life: 100
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                particles.forEach(p => {
                    if(p.life > 0) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.2;
                        p.life--;
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                        active = true;
                    }
                });
                if(active) requestAnimationFrame(animate);
                else ctx.clearRect(0,0,canvas.width, canvas.height);
            }
            animate();
        }

        init();
    </script>
