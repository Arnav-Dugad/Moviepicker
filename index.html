    <style>
        /* --- Base & Reset --- */
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);
            --sar: env(safe-area-inset-right);
        }

        body {
            background-color: #020617; /* Slate 950 */
            color: #e2e8f0;
            overflow: hidden; /* App shell */
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- Utilities --- */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .safe-pb { padding-bottom: max(1rem, var(--sab)); }
        .safe-pt { padding-top: max(1rem, var(--sat)); }
        
        /* --- Animations --- */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slide-up { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        .animate-slide-up { animation: slide-up 0.5s ease-out forwards; }
        
        /* --- Glassmorphism --- */
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* --- Backgrounds --- */
        #dynamic-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            transform: scale(1.1);
            filter: blur(60px) brightness(0.4) saturate(1.2);
            will-change: transform, filter;
        }
        
        /* --- Components --- */
        .aspect-video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .aspect-video-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .mask-gradient-right {
            mask-image: linear-gradient(to right, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
        }

        /* --- Layout Transitions --- */
        .collapsible-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-out;
        }
        .collapsible-content.expanded {
            grid-template-rows: 1fr;
        }
        .collapsible-inner {
            overflow: hidden;
        }
        
        /* Form Elements */
        select { background-image: none; }
        
        @media (max-width: 768px) {
            input, select { font-size: 16px !important; }
        }
    </style>
</head>

            'News':{id:10763, icon:'mic'}, 'Reality':{id:10764, icon:'video'}, 'Sci-Fi & Fantasy':{id:10765, icon:'rocket'},
            'Soap':{id:10766, icon:'coffee'}, 'Talk':{id:10767, icon:'mic-2'}, 'War & Politics':{id:10768, icon:'shield'}
        };

        // --- STATE ---
        let currentMode = 'movie'; // 'movie' or 'tv'
        let currentItem = null;
        let searchTimeout = null;
        let isTrailerExpanded = false;

        // --- INIT ---
        function init() {
            renderGenres();
            lucide.createIcons();
            
            // Initial Background
            updateBackground('https://image.tmdb.org/t/p/original/1E5baAaEse26fej7uHcjOgEE2t2.jpg');

            // Event Listeners
            document.getElementById('logoBtn').onclick = resetApp;
            document.getElementById('modeMovie').onclick = () => switchMode('movie');
            document.getElementById('modeTV').onclick = () => switchMode('tv');
            document.getElementById('surpriseBtn').onclick = surpriseMe;
            document.getElementById('toggleTrailerBtn').onclick = toggleTrailer;

            window.addEventListener('resize', () => {
                const c = document.getElementById('confetti');
                if (!c) return;
                c.width = window.innerWidth;
                c.height = window.innerHeight;
            });

            // Search Listeners
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', handleSearch);
            document.getElementById('clearSearch').onclick = () => {
                searchInput.value = '';
                document.getElementById('searchResults').classList.add('hidden');
                document.getElementById('clearSearch').classList.add('hidden');
            };
        }

        function updateBackground(url) {
            const bg = document.getElementById('dynamic-bg');
            bg.style.backgroundImage = `url('${url}')`;
        }

        function toggleTrailer() {
            const container = document.getElementById('inlineTrailerContainer');
            const icon = document.getElementById('trailerIcon');
            isTrailerExpanded = !isTrailerExpanded;
            
            if (isTrailerExpanded) {
                container.classList.add('expanded');
                icon.style.transform = 'rotate(180deg)';
            } else {
                container.classList.remove('expanded');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // --- NAVIGATION ---
        function switchMode(mode) {
            currentMode = mode;
            // Update Toggle UI
            const activeClass = "px-3 py-1.5 rounded-full text-[11px] font-bold transition-all bg-rose-600 text-white shadow-lg";
            const inactiveClass = "px-3 py-1.5 rounded-full text-[11px] font-bold text-slate-400 hover:text-white transition-all";
            
            document.getElementById('modeMovie').className = mode === 'movie' ? activeClass : inactiveClass;
            document.getElementById('modeTV').className = mode === 'tv' ? activeClass : inactiveClass;
            document.getElementById('modeDescription').textContent = mode === 'movie' ? "Browsing Movies" : "Browsing TV Series";
            
            renderGenres();
            lucide.createIcons();
        }

        function resetApp() {
            document.getElementById('resultView').classList.add('hidden');
            document.getElementById('genreSelectionView').classList.remove('hidden');
            document.getElementById('posterArea').innerHTML = '';
            document.getElementById('inlineTrailer').innerHTML = '';
            updateBackground('https://image.tmdb.org/t/p/original/1E5baAaEse26fej7uHcjOgEE2t2.jpg');
            
            // Reset Trailer State
            isTrailerExpanded = false;
            document.getElementById('inlineTrailerContainer').classList.remove('expanded');
            document.getElementById('trailerIcon').style.transform = 'rotate(0deg)';
            document.getElementById('toggleTrailerBtn').parentElement.classList.add('hidden'); // Hide trailer box by default
            
            // Reset mobile scroll
            document.getElementById('contentScrollArea').scrollTop = 0;
            // Desktop reset (if independently scrolled)
            document.getElementById('detailsCol').scrollTop = 0;
        }

        function renderGenres() {
            const grid = document.getElementById('genreGrid');
            grid.innerHTML = '';
            const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;

            Object.entries(GENRES).forEach(([name, data]) => {
                const btn = document.createElement('button');
                btn.className = "group relative h-24 bg-slate-800/40 hover:bg-rose-600 rounded-xl border border-white/5 transition-all overflow-hidden flex flex-col items-center justify-center gap-1 active:scale-95 shadow-md";
                
                let iconEl;
                if(data.icon === 'sword') iconEl = '<i data-lucide="sword" class="w-6 h-6 text-slate-400 group-hover:text-white transition-colors"></i>';
                else if(data.icon === 'ghost') iconEl = '<div class="text-2xl group-hover:scale-110 transition-transform">👻</div>';
                else iconEl = `<i data-lucide="${data.icon}" class="w-6 h-6 text-slate-400 group-hover:text-white transition-colors"></i>`;

                btn.innerHTML = `
                    <div class="z-10 flex flex-col items-center gap-1">
                        ${iconEl}
                        <span class="text-xs font-bold text-slate-300 group-hover:text-white transition-colors">${name}</span>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                `;
                btn.onclick = () => fetchContent(data.id);
                grid.appendChild(btn);
            });
        }

        // --- SEARCH LOGIC ---
        function handleSearch(e) {
            const query = e.target.value.trim();
            const resultsDiv = document.getElementById('searchResults');
            const clearBtn = document.getElementById('clearSearch');
            
            if(query.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            if (searchTimeout) clearTimeout(searchTimeout);
            
            if (query.length < 2) {
                resultsDiv.classList.add('hidden');
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`);
                    const data = await res.json();
                    
                    if (data.results && data.results.length > 0) {
                        resultsDiv.innerHTML = '';
                        resultsDiv.classList.remove('hidden');
                        
                        const filtered = data.results.filter(item => item.media_type === 'movie' || item.media_type === 'tv').slice(0, 8);

                        if(filtered.length === 0) {
                             resultsDiv.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">No results found</div>';
                             return;
                        }

                        filtered.forEach(item => {
                            if(!item.poster_path && !item.backdrop_path) return;
                            
                            const div = document.createElement('div');
                            div.className = "flex items-center gap-4 p-3 hover:bg-white/10 cursor-pointer border-b border-white/5 last:border-0 transition-colors";
                            const img = item.poster_path ? `${POSTER_URL}${item.poster_path}` : 'https://via.placeholder.com/50x75?text=No+Img';
                            const title = item.title || item.name;
                            const year = (item.release_date || item.first_air_date || '').split('-')[0];
                            const type = item.media_type === 'movie' ? 'Movie' : 'TV Series';
                            
                            div.innerHTML = `
                                <img src="${img}" class="w-10 h-14 object-cover rounded-md shadow-md bg-slate-800">
                                <div class="flex flex-col text-left">
                                    <span class="text-sm font-bold text-white leading-tight mb-0.5 line-clamp-1">${title}</span>
                                    <div class="flex items-center gap-2 text-[10px] text-slate-400">
                                        <span class="uppercase tracking-wider font-semibold text-rose-400">${type}</span>
                                        <span>${year}</span>
                                    </div>
                                </div>
                            `;
                            div.onclick = () => {
                                switchMode(item.media_type);
                                loadItemDetails(item.id);
                                document.getElementById('searchInput').value = '';
                                resultsDiv.classList.add('hidden');
                                document.getElementById('clearSearch').classList.add('hidden');
                            };
                            resultsDiv.appendChild(div);
                        });
                    } else {
                        resultsDiv.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">No results found</div>';
                        resultsDiv.classList.remove('hidden');
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 300); 
        }

        // --- FETCH LOGIC ---
        function surpriseMe() {
            fireConfetti();
            const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;
            const keys = Object.values(GENRES);
            const random = keys[Math.floor(Math.random() * keys.length)];
            fetchContent(random.id);
        }

        async function fetchContent(genreId) {
            showLoading(true);
            try {
                const year = document.getElementById('decadeFilter').value;
                const lang = document.getElementById('languageFilter').value;
                const sort = document.getElementById('sortFilter').value;
                const runtime = document.getElementById('runtimeFilter').value;
                
                let params = `&with_genres=${genreId}&sort_by=${sort}&vote_count.gte=100`;
                if(lang) params += `&with_original_language=${lang}`;
                
                const dateKey = currentMode === 'movie' ? 'primary_release_date' : 'first_air_date';
                if(year === '2024') params += `&${dateKey}.gte=2024-01-01`;
                else if(year === '1980') params += `&${dateKey}.gte=1980-01-01&${dateKey}.lte=1989-12-31`;
                else if(year) params += `&${dateKey}.gte=${year}-01-01&${dateKey}.lte=${parseInt(year)+9}-12-31`;

                if (runtime === 'short') params += `&with_runtime.lte=90`;
                else if (runtime === 'medium') params += `&with_runtime.gte=90&with_runtime.lte=120`;
                else if (runtime === 'long') params += `&with_runtime.gte=120`;

                // SMART PAGINATION
                const initRes = await fetch(`${BASE_URL}/discover/${currentMode}?api_key=${API_KEY}&page=1&include_adult=false${params}`);
                const initData = await initRes.json();

                if(!initData.results || initData.total_results === 0) throw new Error("No content found");

                const totalPages = Math.min(initData.total_pages, 10);
                const randomPage = Math.floor(Math.random() * totalPages) + 1;

                let results = initData.results;
                if(randomPage > 1) {
                    const pageRes = await fetch(`${BASE_URL}/discover/${currentMode}?api_key=${API_KEY}&page=${randomPage}&include_adult=false${params}`);
                    const pageData = await pageRes.json();
                    results = pageData.results;
                }

                if(!results || results.length === 0) throw new Error("No content on this page");
                
                // Filter out items without posters to ensure good UI
                const validResults = results.filter(r => r.poster_path);
                if (validResults.length === 0) throw new Error("No good matches found");

                const item = validResults[Math.floor(Math.random() * validResults.length)];
                await loadItemDetails(item.id);
                
            } catch (err) {
                console.error(err);
                showError("Nothing found. Try broadening filters.");
                showLoading(false);
            }
        }

        async function loadItemDetails(id) {
            showLoading(true);
            try {
                if (!id) throw new Error("Invalid ID");
                
                const res = await fetch(`${BASE_URL}/${currentMode}/${id}?api_key=${API_KEY}&append_to_response=credits,videos,watch/providers,recommendations`);
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const item = await res.json();
                
                if (!item || (item.success === false)) {
                    throw new Error(item.status_message || "Item not found");
                }

                currentItem = item;
                displayResult(item);
            } catch(e) {
                console.error("Load Details Error:", e);
                showError("Failed to load details. Please try again.");
                showLoading(false);
            }
        }

        // --- DISPLAY LOGIC ---
        function displayResult(item) {
            try {
                const title = item.title || item.name || "Unknown";
                const date = item.release_date || item.first_air_date || '';
                const year = date.split('-')[0] || 'N/A';
                
                // Text Content
                document.getElementById('resTitle').textContent = title;
                document.getElementById('resTagline').textContent = item.tagline || '';
                document.getElementById('resYear').textContent = year;
                document.getElementById('resRating').innerHTML = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                document.getElementById('resPlot').textContent = item.overview || "No synopsis available.";
                document.getElementById('resGenre').textContent = item.genres?.[0]?.name || 'Unknown';

                // Background
                if(item.poster_path) {
                    updateBackground(`${IMG_URL}${item.poster_path}`);
                    document.getElementById('mobilePosterBg').style.backgroundImage = `url('${IMG_URL}${item.poster_path}')`;
                } else if (item.backdrop_path) {
                    updateBackground(`${IMG_URL}${item.backdrop_path}`);
                    document.getElementById('mobilePosterBg').style.backgroundImage = `url('${IMG_URL}${item.backdrop_path}')`;
                }

                // --- INFO LOGIC (MOVIE vs TV) ---
                const metaChips = document.getElementById('metaChips');
                const extraPanel = document.getElementById('extraInfoPanel');
                metaChips.innerHTML = '';
                extraPanel.innerHTML = '';

                // Common Chip: Lang
                metaChips.innerHTML += `<div class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-xs font-medium text-white uppercase tracking-wider">${item.original_language || 'EN'}</div>`;
                // Common Chip: Status
                if(item.status) {
                    const statusColor = item.status === 'Released' || item.status === 'Returning Series' ? 'text-green-400' : 'text-slate-400';
                    metaChips.innerHTML += `<div class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-xs font-medium ${statusColor}">${item.status}</div>`;
                }

                if(currentMode === 'movie') {
                    // Movie Runtime
                    if(item.runtime) {
                        const h = Math.floor(item.runtime / 60);
                        const m = item.runtime % 60;
                        const timeStr = h > 0 ? `${h}h ${m}m` : `${m}m`;
                        metaChips.innerHTML += `<div class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-xs font-medium text-white flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${timeStr}</div>`;
                    }
                    // Movie Extra Info
                    extraPanel.innerHTML = `
                        <div><span class="block font-bold text-slate-500 uppercase text-[10px] mb-0.5">Budget</span><span class="text-white font-medium">${item.budget > 0 ? '$'+(item.budget/1000000).toFixed(1)+'M' : '-'}</span></div>
                        <div><span class="block font-bold text-slate-500 uppercase text-[10px] mb-0.5">Revenue</span><span class="text-white font-medium">${item.revenue > 0 ? '$'+(item.revenue/1000000).toFixed(1)+'M' : '-'}</span></div>
                        <div class="col-span-2"><span class="block font-bold text-slate-500 uppercase text-[10px] mb-0.5">Production</span><span class="text-white font-medium truncate block">${item.production_companies?.[0]?.name || '-'}</span></div>
                    `;
                } else {
                    // TV Info
                    if(item.number_of_seasons) {
                        metaChips.innerHTML += `<div class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-xs font-medium text-white flex items-center gap-1"><i data-lucide="layers" class="w-3 h-3"></i> ${item.number_of_seasons} Seasons</div>`;
                    }
                    if(item.number_of_episodes) {
                        metaChips.innerHTML += `<div class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-xs font-medium text-white flex items-center gap-1"><i data-lucide="film" class="w-3 h-3"></i> ${item.number_of_episodes} Eps</div>`;
                    }
                    // TV Extra Info
                    extraPanel.innerHTML = `
                        <div><span class="block font-bold text-slate-500 uppercase text-[10px] mb-0.5">First Air</span><span class="text-white font-medium">${item.first_air_date || '-'}</span></div>
                        <div><span class="block font-bold text-slate-500 uppercase text-[10px] mb-0.5">Last Air</span><span class="text-white font-medium">${item.last_air_date || '-'}</span></div>
                        <div class="col-span-2"><span class="block font-bold text-slate-500 uppercase text-[10px] mb-0.5">Network</span><span class="text-white font-medium truncate block">${item.networks?.[0]?.name || '-'}</span></div>
                    `;
                }

                // Poster
                const posterArea = document.getElementById('posterArea');
                if(item.poster_path) {
                    posterArea.innerHTML = `<img src="${POSTER_URL}${item.poster_path}" class="w-full h-full object-cover shadow-2xl rounded-xl">`;
                } else {
                    posterArea.innerHTML = `<div class="w-full h-full bg-slate-900 rounded-xl flex items-center justify-center text-slate-500"><i data-lucide="image-off" class="w-12 h-12"></i></div>`;
                }

                // Trailer
                const trailer = item.videos?.results?.find(v => v.site === 'YouTube' && v.type === 'Trailer' && v.official) || item.videos?.results?.find(v => v.site === 'YouTube' && v.type === 'Trailer');
                const inlineTrailer = document.getElementById('inlineTrailer');
                const toggleBtn = document.getElementById('toggleTrailerBtn');
                inlineTrailer.innerHTML = '';
                isTrailerExpanded = false;
                document.getElementById('inlineTrailerContainer').classList.remove('expanded');
                document.getElementById('trailerIcon').style.transform = 'rotate(0deg)';

                if(trailer) {
                    toggleBtn.parentElement.classList.remove('hidden');
                    const embedUrl = `https://www.youtube.com/embed/${trailer.key}?autoplay=0&controls=1&rel=0`;
                    // Delay loading iframe until user clicks expand for better performance? 
                    // For now, load on click.
                    toggleBtn.onclick = () => {
                         if(!isTrailerExpanded) {
                             inlineTrailer.innerHTML = `<iframe src="${embedUrl}" title="Trailer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                         }
                         toggleTrailer();
                    }
                } else {
                    toggleBtn.parentElement.classList.add('hidden');
                    inlineTrailer.innerHTML = '';
                }

                // Providers
                const provs = item['watch/providers']?.results?.['IN'] || item['watch/providers']?.results?.['US'];
                const provArea = document.getElementById('providersArea');
                const provList = document.getElementById('providerIcons');
                provList.innerHTML = '';
                
                if(provs && (provs.flatrate || provs.buy || provs.rent)) {
                    provArea.classList.remove('hidden');
                    const methods = [...(provs.flatrate||[]), ...(provs.buy||[]), ...(provs.rent||[])];
                    const unique = new Map();
                    methods.forEach(p => unique.set(p.provider_id, p));
                    
                    Array.from(unique.values()).slice(0, 6).forEach(p => {
                        const a = document.createElement('a');
                        let searchUrl = STREAM_URLS[p.provider_name] ? `${STREAM_URLS[p.provider_name]}${encodeURIComponent(title)}` : `https://www.google.com/search?q=watch ${encodeURIComponent(title)} on ${p.provider_name}`;
                        
                        a.href = searchUrl;
                        a.target = "_blank";
                        a.className = "hover:scale-105 transition-transform flex-shrink-0";
                        a.innerHTML = `<img src="https://image.tmdb.org/t/p/original${p.logo_path}" class="w-10 h-10 rounded-lg shadow-md border border-white/10" title="Watch on ${p.provider_name}" alt="${p.provider_name}">`;
                        provList.appendChild(a);
                    });
                } else {
                    provArea.classList.add('hidden');
                }

                // Cast
                const castList = document.getElementById('castList');
                castList.innerHTML = '';
                (item.credits?.cast || []).slice(0, 8).forEach(c => {
                    const div = document.createElement('div');
                    div.className = "flex flex-col items-center min-w-[64px] gap-2 group/cast cursor-pointer";
                    const img = c.profile_path ? `${PROFILE_URL}${c.profile_path}` : 'https://via.placeholder.com/100x100?text=?';
                    
                    div.innerHTML = `
                        <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-white/10 group-hover/cast:border-rose-500 transition-all shadow-md relative">
                            <img src="${img}" class="w-full h-full object-cover">
                        </div>
                        <span class="text-[10px] text-slate-400 font-bold text-center truncate w-full group-hover/cast:text-white transition-colors">${c.name}</span>
                    `;
                    div.onclick = () => window.open(`https://www.google.com/search?q=${encodeURIComponent(c.name)}`, '_blank');
                    castList.appendChild(div);
                });

                // Recommendations
                const recs = item.recommendations?.results || [];
                const recsArea = document.getElementById('recsArea');
                const recsList = document.getElementById('recsList');
                recsList.innerHTML = '';
                
                if(recs.length > 0) {
                    recsArea.classList.remove('hidden');
                    recs.slice(0, 8).forEach(r => {
                        if(!r.poster_path) return;
                        const div = document.createElement('div');
                        div.className = "relative min-w-[90px] h-[135px] rounded-lg overflow-hidden cursor-pointer hover:scale-105 transition-transform border border-white/10 shadow-lg group/rec";
                        div.innerHTML = `
                            <img src="${POSTER_URL}${r.poster_path}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover/rec:opacity-100 transition-opacity flex items-center justify-center">
                                <i data-lucide="eye" class="text-white w-6 h-6"></i>
                            </div>
                        `;
                        div.onclick = () => {
                            if (r.media_type) currentMode = r.media_type; 
                            loadItemDetails(r.id);
                            // Scroll to top
                            document.getElementById('contentScrollArea').scrollTop = 0;
                            document.getElementById('detailsCol').scrollTop = 0;
                        };
                        recsList.appendChild(div);
                    });
                } else {
                    recsArea.classList.add('hidden');
                }

                // Stream Button Link
                document.getElementById('streamLink').href = `https://www.justwatch.com/in/search?q=${encodeURIComponent(title)}`;

                // Switch Views
                document.getElementById('genreSelectionView').classList.add('hidden');
                document.getElementById('resultView').classList.remove('hidden');
                lucide.createIcons();

            } catch (err) {
                console.error("Display Error:", err);
                showError("Error displaying content.");
            } finally {
                showLoading(false);
            }
        }

        // --- HELPERS ---
        function showLoading(show) {
            const el = document.getElementById('loadingView');
            if(show) {
                el.classList.remove('hidden');
            } else {
                // Fade out effect
                el.classList.add('opacity-0');
                setTimeout(() => {
                    el.classList.add('hidden');
                    el.classList.remove('opacity-0');
                }, 300);
            }
        }

        function showError(msg) {
            const t = document.getElementById('errorToast');
            document.getElementById('errorText').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function shareContent() {
            if(!currentItem) return;
            const title = currentItem.title || currentItem.name;
            const text = `Check out "${title}" on WatchNext!`;
            if(navigator.share) {
                navigator.share({ title: 'WatchNext Pick', text: text });
            } else {
                navigator.clipboard.writeText(text);
                showError("Copied to clipboard!");
            }
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const particles = Array.from({length: 50}, () => ({
                x: canvas.width/2, y: canvas.height/2,
                vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
                color: `hsl(${Math.random()*360}, 100%, 50%)`,
                life: 100
            }));
            
            function animate() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                let active = false;
                particles.forEach(p => {
                    if(p.life > 0) {
                        p.x+=p.vx; p.y+=p.vy; p.vy+=0.5; p.life--;
                        ctx.fillStyle = p.color; ctx.fillRect(p.x,p.y,5,5);
                        active=true;
                    }
                });
                if(active) requestAnimationFrame(animate);
            }
            animate();
        }

        init();
    </script>
</body>
