    <style>
        /* Base Setup */
        :root {
            --header-height: 64px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            background-color: #020617;
            color: #e2e8f0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Prevent rubber-banding on iOS */
            overscroll-behavior: none;
        }

        /* Utility */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .text-shadow { text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

        /* Animations */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        .animate-slide-up { animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Backgrounds & Glass */
        #dynamic-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            filter: blur(40px) brightness(0.4);
            transform: scale(1.1); /* Prevent blur edges */
        }
        
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Mobile specific inputs to prevent zooming */
        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
            .mobile-safe-bottom {
                padding-bottom: calc(1rem + var(--safe-bottom));
            }
        }

        /* Result View Layout Helpers */
        .mask-gradient-bottom {
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }
        
        /* Interactive Elements */
        .touch-target {
            min-height: 44px;
            min-width: 44px;
        }

        /* Collapsible Section */
        .collapsible-content {
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }
        .collapsible-content.expanded {
            max-height: 500px;
            opacity: 1;
        }

        /* Aspect Ratio for Videos */
        .aspect-video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .aspect-video-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

        const API_KEY = "2b834d5234781ad70bd646922e9ddd18";

        const IMG_URL = "https://image.tmdb.org/t/p/original";
        const POSTER_URL = "https://image.tmdb.org/t/p/w780";
        const PROFILE_URL = "https://image.tmdb.org/t/p/w185";

        const STREAM_URLS = {
            'Netflix': 'https://www.netflix.com/search?q=',
            'Amazon Prime Video': 'https://www.primevideo.com/search/ref=atv_nb_sr?phrase=',
            'Disney Plus': 'https://www.disneyplus.com/search?q=',
            'Hotstar': 'https://www.hotstar.com/in/explore?q=',

            'Hulu': 'https://www.hulu.com/search?q=',

            'HBO Max': 'https://play.hbomax.com/search?q=',
            'Crunchyroll': 'https://www.crunchyroll.com/search?q=',
            'Peacock': 'https://www.peacocktv.com/search?q=',
            'Paramount+': 'https://www.paramountplus.com/search/?q='
        };

        const MOVIE_GENRES = {
            'Action': {id:28, icon:'sword'}, 'Adventure':{id:12, icon:'map'}, 'Animation':{id:16, icon:'palette'},
            'Comedy':{id:35, icon:'smile'}, 'Crime':{id:80, icon:'siren'}, 'Documentary':{id:99, icon:'file-text'},
            'Drama':{id:18, icon:'drama'}, 'Family':{id:10751, icon:'home'}, 'Fantasy':{id:14, icon:'wand'},
            'History':{id:36, icon:'hourglass'}, 'Horror':{id:27, icon:'ghost'}, 'Music':{id:10402, icon:'music'},
            'Mystery':{id:9648, icon:'search'}, 'Romance':{id:10749, icon:'heart'}, 'Sci-Fi':{id:878, icon:'rocket'},
            'Thriller':{id:53, icon:'eye'}, 'War':{id:10752, icon:'shield'}
        };

        const TV_GENRES = {
            'Action':{id:10759, icon:'sword'}, 'Animation':{id:16, icon:'palette'}, 'Comedy':{id:35, icon:'smile'},
            'Crime':{id:80, icon:'siren'}, 'Documentary':{id:99, icon:'file-text'}, 'Drama':{id:18, icon:'drama'},
            'Family':{id:10751, icon:'home'}, 'Kids':{id:10762, icon:'baby'}, 'Mystery':{id:9648, icon:'search'},
            'News':{id:10763, icon:'mic'}, 'Reality':{id:10764, icon:'video'}, 'Sci-Fi':{id:10765, icon:'rocket'},
            'Soap':{id:10766, icon:'coffee'}, 'Talk':{id:10767, icon:'mic-2'}, 'War':{id:10768, icon:'shield'}
        };

        // --- STATE ---
        let currentMode = 'movie'; 
        let currentItem = null;
        let searchTimeout = null;
        let isTrailerExpanded = false;
        let touchStartY = 0;
        let touchEndY = 0;

        // --- INIT ---
        function init() {
            renderGenres();
            lucide.createIcons();
            
            // Initial Background
            document.getElementById('dynamic-bg').style.backgroundImage = `url('https://image.tmdb.org/t/p/original/1E5baAaEse26fej7uHcjOgEE2t2.jpg')`;

            // Event Listeners
            document.getElementById('logoBtn').onclick = resetApp;
            document.getElementById('modeMovie').onclick = () => switchMode('movie');
            document.getElementById('modeTV').onclick = () => switchMode('tv');
            document.getElementById('surpriseBtn').onclick = surpriseMe;
            document.getElementById('toggleTrailerBtn').onclick = toggleTrailer;

            // Search Listeners
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', handleSearch);
            document.getElementById('clearSearch').onclick = () => {
                searchInput.value = '';
                document.getElementById('searchResults').classList.add('hidden');
                document.getElementById('clearSearch').classList.add('hidden');
                searchInput.focus();
            };

            // Swipe to close Logic (Mobile)
            const resView = document.getElementById('resultView');
            resView.addEventListener('touchstart', e => {
                touchStartY = e.changedTouches[0].screenY;
            }, {passive: true});

            resView.addEventListener('touchend', e => {
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            }, {passive: true});
        }

        function handleSwipe() {
            // If user swipes down significantly on the result view, and scroll is at top
            if (touchEndY - touchStartY > 150) {
                // Ideally check if detailsPane is at scrollTop 0, but for simplicity:
                const details = document.getElementById('detailsPane');
                if(details.scrollTop < 10) {
                   resetApp();
                }
            }
        }

        function toggleTrailer() {
            const container = document.getElementById('inlineTrailerContainer');
            const icon = document.getElementById('trailerIcon');
            isTrailerExpanded = !isTrailerExpanded;
            
            if (isTrailerExpanded) {
                container.classList.add('expanded');
                icon.style.transform = 'rotate(180deg)';
            } else {
                container.classList.remove('expanded');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            // Update UI state manually to avoid complex class logic in HTML
            const btnMovie = document.getElementById('modeMovie');
            const btnTV = document.getElementById('modeTV');
            
            const activeClass = "bg-rose-600 text-white shadow-lg";
            const inactiveClass = "text-slate-400 hover:text-white";

            if (mode === 'movie') {
                btnMovie.className = `px-3 py-1.5 rounded-full text-[10px] font-bold transition-all touch-target flex items-center justify-center ${activeClass}`;
                btnTV.className = `px-3 py-1.5 rounded-full text-[10px] font-bold transition-all touch-target flex items-center justify-center ${inactiveClass}`;
                document.getElementById('modeDescription').textContent = "Movies";
            } else {
                btnMovie.className = `px-3 py-1.5 rounded-full text-[10px] font-bold transition-all touch-target flex items-center justify-center ${inactiveClass}`;
                btnTV.className = `px-3 py-1.5 rounded-full text-[10px] font-bold transition-all touch-target flex items-center justify-center ${activeClass}`;
                document.getElementById('modeDescription').textContent = "TV Series";
            }
            renderGenres();
            lucide.createIcons();
        }

        function resetApp() {
            document.getElementById('resultView').classList.add('hidden');
            document.getElementById('genreSelectionView').classList.remove('hidden');
            
            // Clean up heavy elements
            setTimeout(() => {
                document.getElementById('posterArea').innerHTML = '';
                document.getElementById('inlineTrailer').innerHTML = '';
                document.getElementById('posterBgFill').style.backgroundImage = 'none';
            }, 300);
            
            document.getElementById('dynamic-bg').style.backgroundImage = `url('https://image.tmdb.org/t/p/original/1E5baAaEse26fej7uHcjOgEE2t2.jpg')`;
            
            // Reset Trailer
            isTrailerExpanded = false;
            document.getElementById('inlineTrailerContainer').classList.remove('expanded');
            document.getElementById('trailerIcon').style.transform = 'rotate(0deg)';
        }

        function renderGenres() {
            const grid = document.getElementById('genreGrid');
            grid.innerHTML = '';
            const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;

            Object.entries(GENRES).forEach(([name, data]) => {
                const btn = document.createElement('button');
                btn.className = "group relative h-20 md:h-24 bg-slate-800/60 hover:bg-rose-600 rounded-xl border border-white/5 transition-all overflow-hidden flex flex-col items-center justify-center gap-1 active:scale-95 touch-target shadow-md";
                
                let iconEl;
                if(data.icon === 'sword') iconEl = '<i data-lucide="sword" class="w-5 h-5 md:w-6 md:h-6 text-slate-400 group-hover:text-white transition-colors"></i>';
                else if(data.icon === 'ghost') iconEl = '<div class="text-xl md:text-2xl group-hover:scale-110 transition-transform">👻</div>';
                else iconEl = `<i data-lucide="${data.icon}" class="w-5 h-5 md:w-6 md:h-6 text-slate-400 group-hover:text-white transition-colors"></i>`;

                btn.innerHTML = `
                    <div class="z-10 flex flex-col items-center gap-1">
                        ${iconEl}
                        <span class="text-[10px] md:text-xs font-bold text-slate-300 group-hover:text-white">${name}</span>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                `;
                btn.onclick = () => fetchContent(data.id);
                grid.appendChild(btn);
            });
        }

        // --- SEARCH ---
        function handleSearch(e) {
            const query = e.target.value.trim();
            const resultsDiv = document.getElementById('searchResults');
            const clearBtn = document.getElementById('clearSearch');
            
            if(query.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            if (searchTimeout) clearTimeout(searchTimeout);
            
            if (query.length < 2) {
                resultsDiv.classList.add('hidden');
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`);
                    const data = await res.json();
                    
                    if (data.results && data.results.length > 0) {
                        resultsDiv.innerHTML = '';
                        resultsDiv.classList.remove('hidden');
                        
                        const filtered = data.results.filter(item => item.media_type === 'movie' || item.media_type === 'tv').slice(0, 8);

                        if(filtered.length === 0) {
                             resultsDiv.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">No results found</div>';
                             return;
                        }

                        filtered.forEach(item => {
                            if(!item.poster_path && !item.backdrop_path) return;
                            
                            const div = document.createElement('div');
                            div.className = "flex items-center gap-3 p-3 hover:bg-white/10 cursor-pointer border-b border-white/5 last:border-0 transition-colors";
                            const img = item.poster_path ? `${PROFILE_URL}${item.poster_path}` : 'https://via.placeholder.com/50x75?text=No+Img';
                            const title = item.title || item.name;
                            const year = (item.release_date || item.first_air_date || '').split('-')[0];
                            const type = item.media_type === 'movie' ? 'Movie' : 'TV';
                            
                            div.innerHTML = `
                                <img src="${img}" class="w-8 h-12 object-cover rounded-md shadow bg-slate-800">
                                <div class="flex flex-col text-left">
                                    <span class="text-sm font-bold text-white leading-tight line-clamp-1">${title}</span>
                                    <div class="flex items-center gap-2 text-[10px] text-slate-400">
                                        <span class="uppercase tracking-wider font-semibold text-rose-400">${type}</span>
                                        <span>${year}</span>
                                    </div>
                                </div>
                            `;
                            div.onclick = () => {
                                switchMode(item.media_type);
                                loadItemDetails(item.id);
                                document.getElementById('searchInput').value = '';
                                resultsDiv.classList.add('hidden');
                                document.getElementById('clearSearch').classList.add('hidden');
                            };
                            resultsDiv.appendChild(div);
                        });
                    } else {
                        resultsDiv.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">No results found</div>';
                        resultsDiv.classList.remove('hidden');
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 300); 
        }

        // --- FETCHING ---
        function surpriseMe() {
            fireConfetti();
            const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;
            const keys = Object.values(GENRES);
            const random = keys[Math.floor(Math.random() * keys.length)];
            fetchContent(random.id);
        }

        async function fetchContent(genreId) {
            showLoading(true);
            try {
                const year = document.getElementById('decadeFilter').value;
                const lang = document.getElementById('languageFilter').value;
                const sort = document.getElementById('sortFilter').value;
                const runtime = document.getElementById('runtimeFilter').value;
                
                let params = `&with_genres=${genreId}&sort_by=${sort}&vote_count.gte=100`;
                if(lang) params += `&with_original_language=${lang}`;
                
                const dateKey = currentMode === 'movie' ? 'primary_release_date' : 'first_air_date';
                if(year === '2024') params += `&${dateKey}.gte=2024-01-01`;
                else if(year === '1980') params += `&${dateKey}.gte=1980-01-01&${dateKey}.lte=1989-12-31`;
                else if(year) params += `&${dateKey}.gte=${year}-01-01&${dateKey}.lte=${parseInt(year)+9}-12-31`;

                if (runtime === 'short') params += `&with_runtime.lte=90`;
                else if (runtime === 'medium') params += `&with_runtime.gte=90&with_runtime.lte=120`;
                else if (runtime === 'long') params += `&with_runtime.gte=120`;

                // Smart Randomization
                const initRes = await fetch(`${BASE_URL}/discover/${currentMode}?api_key=${API_KEY}&page=1&include_adult=false${params}`);
                const initData = await initRes.json();

                if(!initData.results || initData.total_results === 0) throw new Error("No content found");

                const totalPages = Math.min(initData.total_pages, 10);
                const randomPage = Math.floor(Math.random() * totalPages) + 1;

                let results = initData.results;
                if(randomPage > 1) {
                    const pageRes = await fetch(`${BASE_URL}/discover/${currentMode}?api_key=${API_KEY}&page=${randomPage}&include_adult=false${params}`);
                    const pageData = await pageRes.json();
                    results = pageData.results;
                }

                if(!results || results.length === 0) throw new Error("No content on this page");
                
                const item = results[Math.floor(Math.random() * results.length)];
                await loadItemDetails(item.id);
                
            } catch (err) {
                console.error(err);
                showError("Nothing found with those filters.");
                showLoading(false);
            }
        }

        async function loadItemDetails(id) {
            showLoading(true);
            try {
                if (!id) throw new Error("Invalid ID");
                
                const res = await fetch(`${BASE_URL}/${currentMode}/${id}?api_key=${API_KEY}&append_to_response=credits,videos,watch/providers,recommendations`);
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const item = await res.json();
                
                if (!item || (item.success === false)) {
                    throw new Error(item.status_message || "Item not found");
                }

                currentItem = item;
                displayResult(item);
            } catch(e) {
                console.error("Load Details Error:", e);
                showError("Failed to load details. Try again.");
                showLoading(false);
            }
        }

        function displayResult(item) {
            try {
                const title = item.title || item.name || "Unknown";
                const date = item.release_date || item.first_air_date || '';
                const year = date.split('-')[0] || 'N/A';
                
                // Content
                document.getElementById('resTitle').textContent = title;
                document.getElementById('resTagline').textContent = item.tagline || '';
                document.getElementById('resYear').textContent = year;
                document.getElementById('resRating').innerHTML = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                document.getElementById('resPlot').textContent = item.overview || "No synopsis available.";
                document.getElementById('resGenre').textContent = item.genres?.[0]?.name || 'Unknown';

                // Backgrounds
                if(item.poster_path) {
                    document.getElementById('dynamic-bg').style.backgroundImage = `url('${IMG_URL}${item.poster_path}')`;
                    document.getElementById('posterBgFill').style.backgroundImage = `url('${IMG_URL}${item.poster_path}')`;
                } else if (item.backdrop_path) {
                    document.getElementById('dynamic-bg').style.backgroundImage = `url('${IMG_URL}${item.backdrop_path}')`;
                    document.getElementById('posterBgFill').style.backgroundImage = `url('${IMG_URL}${item.backdrop_path}')`;
                }

                // Chips
                const metaChips = document.getElementById('metaChips');
                metaChips.innerHTML = '';
                metaChips.innerHTML += `<div class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-[10px] md:text-xs font-medium text-white uppercase">${item.original_language || 'EN'}</div>`;
                
                if(currentMode === 'movie' && item.runtime) {
                    metaChips.innerHTML += `<div class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-[10px] md:text-xs font-medium text-white flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${item.runtime}m</div>`;
                } else if (currentMode === 'tv') {
                     if(item.number_of_seasons) metaChips.innerHTML += `<div class="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-[10px] md:text-xs font-medium text-white flex items-center gap-1"><i data-lucide="layers" class="w-3 h-3"></i> ${item.number_of_seasons} S</div>`;
                }

                // Poster
                const posterArea = document.getElementById('posterArea');
                if(item.poster_path) {
                    // Desktop: Full poster. Mobile: Full poster cropped or fitted.
                    posterArea.innerHTML = `<img src="${POSTER_URL}${item.poster_path}" class="w-full h-full object-cover md:object-contain object-top shadow-2xl">`;
                } else {
                    posterArea.innerHTML = `<div class="w-full h-full bg-slate-800 flex items-center justify-center text-slate-500"><i data-lucide="image-off" class="w-12 h-12"></i></div>`;
                }

                // Trailer
                const trailer = item.videos?.results?.find(v => v.site === 'YouTube' && v.type === 'Trailer') || item.videos?.results?.[0];
                const inlineTrailer = document.getElementById('inlineTrailer');
                const toggleBtn = document.getElementById('toggleTrailerBtn');
                
                // Reset trailer state
                inlineTrailer.innerHTML = '';
                isTrailerExpanded = false;
                document.getElementById('inlineTrailerContainer').classList.remove('expanded');
                
                if(trailer) {
                    toggleBtn.parentElement.classList.remove('hidden');
                    // We only load the iframe when expanded to save data, OR load standard embed now
                    const embedUrl = `https://www.youtube.com/embed/${trailer.key}?autoplay=0&controls=1&rel=0&modestbranding=1`;
                    // Pre-load logic or lazy load? Let's just store the URL and inject on click? 
                    // For simplicity, inject now but don't autoplay
                     inlineTrailer.innerHTML = `<iframe src="${embedUrl}" title="Trailer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
                } else {
                    toggleBtn.parentElement.classList.add('hidden');
                }

                // Providers
                const provs = item['watch/providers']?.results?.['IN'] || item['watch/providers']?.results?.['US'];
                const provArea = document.getElementById('providersArea');
                const provList = document.getElementById('providerIcons');
                provList.innerHTML = '';
                
                if(provs && (provs.flatrate || provs.buy || provs.rent)) {
                    provArea.classList.remove('hidden');
                    const methods = [...(provs.flatrate||[]), ...(provs.buy||[]), ...(provs.rent||[])];
                    const unique = new Map();
                    methods.forEach(p => unique.set(p.provider_id, p));
                    
                    Array.from(unique.values()).slice(0, 5).forEach(p => {
                        const a = document.createElement('a');
                        let searchUrl = STREAM_URLS[p.provider_name] ? `${STREAM_URLS[p.provider_name]}${encodeURIComponent(title)}` : `https://www.google.com/search?q=watch ${encodeURIComponent(title)} on ${p.provider_name}`;
                        a.href = searchUrl;
                        a.target = "_blank";
                        a.innerHTML = `<img src="https://image.tmdb.org/t/p/original${p.logo_path}" class="w-10 h-10 rounded-lg shadow-md border border-white/10" title="${p.provider_name}">`;
                        provList.appendChild(a);
                    });
                } else {
                    provArea.classList.add('hidden');
                }

                // Cast
                const castList = document.getElementById('castList');
                castList.innerHTML = '';
                (item.credits?.cast || []).slice(0, 8).forEach(c => {
                    const div = document.createElement('div');
                    div.className = "flex flex-col items-center min-w-[60px] gap-1";
                    const img = c.profile_path ? `${PROFILE_URL}${c.profile_path}` : 'https://via.placeholder.com/100x100?text=?';
                    div.innerHTML = `
                        <div class="w-12 h-12 rounded-full overflow-hidden border border-white/20 shadow-sm">
                            <img src="${img}" class="w-full h-full object-cover">
                        </div>
                        <span class="text-[9px] text-slate-400 font-bold text-center truncate w-full">${c.name}</span>
                    `;
                    castList.appendChild(div);
                });

                // Update Links
                const justWatchLink = `https://www.justwatch.com/in/search?q=${encodeURIComponent(title)}`;
                document.getElementById('streamLinkDesktop').href = justWatchLink;
                document.getElementById('streamLinkMobile').href = justWatchLink;

                // Toggle Views
                document.getElementById('genreSelectionView').classList.add('hidden');
                document.getElementById('resultView').classList.remove('hidden');
                
                // Scroll details to top
                document.getElementById('detailsPane').scrollTop = 0;
                
                lucide.createIcons();

            } catch (err) {
                console.error("Display Error:", err);
                showError("Error displaying content.");
            } finally {
                showLoading(false);
            }
        }

        // --- UTILS ---
        function showLoading(show) {
            const el = document.getElementById('loadingView');
            if(show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function showError(msg) {
            const t = document.getElementById('errorToast');
            document.getElementById('errorText').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function shareContent() {
            if(!currentItem) return;
            const title = currentItem.title || currentItem.name;
            const text = `Check out "${title}" on WatchNext!`;
            if(navigator.share) {
                navigator.share({ title: 'WatchNext', text: text, url: window.location.href });
            } else {
                navigator.clipboard.writeText(text);
                showError("Copied to clipboard!");
            }
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const particles = Array.from({length: 40}, () => ({
                x: canvas.width/2, y: canvas.height/2,
                vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
                color: `hsl(${Math.random()*360}, 100%, 60%)`,
                life: 80
            }));
            
            function animate() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                let active = false;
                particles.forEach(p => {
                    if(p.life > 0) {
                        p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life--;
                        ctx.fillStyle = p.color; ctx.fillRect(p.x,p.y,4,4);
                        active=true;
                    }
                });
                if(active) requestAnimationFrame(animate);
            }
            animate();
        }

        init();
    </script>
