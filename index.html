    <style>
        /* Base Setup */
        body {
            background-color: #020617; /* Slate 950 */
            color: #e2e8f0;
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
            /* Use small viewport height to prevent address bar jumps */
            height: 100svh; 
        }

        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .animate-fade-in { animation: fade-in 0.6s ease-out forwards; }
        
        /* Glassmorphism */
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Dynamic Background */
        #dynamic-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            transform: scale(1.05);
            filter: blur(40px) brightness(0.4);
            -webkit-filter: blur(40px) brightness(0.4);
        }
        #bg-overlay {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at center, rgba(2,6,23,0.3) 0%, rgba(2,6,23,0.9) 100%);
        }

        /* Aspect Ratio Helpers */
        .aspect-video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .aspect-video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Search Dropdown Animation */
        #searchResults {
            transition: all 0.2s ease-in-out;
            transform-origin: top;
        }
        
        .text-shadow { text-shadow: 0 4px 12px rgba(0,0,0,0.9); }
        
        /* Mobile Specific Utilities */
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 20px); }

        /* Ensure smooth scrolling on iOS */
        .custom-scroll {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        /* Expand/Collapse Transition */
        .collapsible-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }
        .collapsible-content.expanded {
            max-height: 500px;
            opacity: 1;
        }

        /* Mobile Font Tweaks */
        @media (max-width: 640px) {
            input, select, textarea { font-size: 16px !important; } /* Prevents iOS zoom */
        }
    </style>
</head>

    <script>
        // --- CONFIG ---
        const API_KEY = "2b834d5234781ad70bd646922e9ddd18";
        const BASE_URL = "https://api.themoviedb.org/3";
        const IMG_URL_ORIGINAL = "https://image.tmdb.org/t/p/original";
        const IMG_URL_W500 = "https://image.tmdb.org/t/p/w500"; // Lighter weight for posters
        const POSTER_URL = "https://image.tmdb.org/t/p/w780";
        const PROFILE_URL = "https://image.tmdb.org/t/p/w185";

        const STREAM_URLS = {
            'Netflix': 'https://www.netflix.com/search?q=',
            'Amazon Prime Video': 'https://www.primevideo.com/search/ref=atv_nb_sr?phrase=',
            'Disney Plus': 'https://www.disneyplus.com/search?q=',
            'Hotstar': 'https://www.hotstar.com/in/explore?q=',
            'Disney+ Hotstar': 'https://www.hotstar.com/in/explore?q=',
            'Hulu': 'https://www.hulu.com/search?q=',
            'YouTube': 'https://www.youtube.com/results?search_query=',
            'JioCinema': 'https://www.jiocinema.com/search/',
            'Zee5': 'https://www.zee5.com/search?q=',
            'SonyLIV': 'https://www.sonyliv.com/search/',
            'Apple TV': 'https://tv.apple.com/search?term=',
            'HBO Max': 'https://play.hbomax.com/search?q=',
            'Peacock': 'https://www.peacocktv.com/search?q=',
            'Paramount+': 'https://www.paramountplus.com/search/?q='
        };

        const MOVIE_GENRES = {
            'Action': {id:28, icon:'sword'}, 'Adventure':{id:12, icon:'map'}, 'Animation':{id:16, icon:'palette'},
            'Comedy':{id:35, icon:'smile'}, 'Crime':{id:80, icon:'siren'}, 'Documentary':{id:99, icon:'file-text'},
            'Drama':{id:18, icon:'drama'}, 'Family':{id:10751, icon:'home'}, 'Fantasy':{id:14, icon:'wand'},
            'History':{id:36, icon:'hourglass'}, 'Horror':{id:27, icon:'ghost'}, 'Music':{id:10402, icon:'music'},
            'Mystery':{id:9648, icon:'search'}, 'Romance':{id:10749, icon:'heart'}, 'Sci-Fi':{id:878, icon:'rocket'},
            'Thriller':{id:53, icon:'eye'}, 'War':{id:10752, icon:'shield'}
        };

        const TV_GENRES = {
            'Action & Adv':{id:10759, icon:'sword'}, 'Animation':{id:16, icon:'palette'}, 'Comedy':{id:35, icon:'smile'},
            'Crime':{id:80, icon:'siren'}, 'Documentary':{id:99, icon:'file-text'}, 'Drama':{id:18, icon:'drama'},
            'Family':{id:10751, icon:'home'}, 'Kids':{id:10762, icon:'baby'}, 'Mystery':{id:9648, icon:'search'},
            'News':{id:10763, icon:'mic'}, 'Reality':{id:10764, icon:'video'}, 'Sci-Fi & Fantasy':{id:10765, icon:'rocket'},
            'Soap':{id:10766, icon:'coffee'}, 'Talk':{id:10767, icon:'mic-2'}, 'War & Politics':{id:10768, icon:'shield'}
        };

        // --- STATE ---
        let currentMode = 'movie'; 
        let currentItem = null;
        let searchTimeout = null;
        let isTrailerExpanded = false;

        // --- INIT ---
        function init() {
            renderGenres();
            lucide.createIcons();
            
            // Initial Background
            document.getElementById('dynamic-bg').style.backgroundImage = `url('https://image.tmdb.org/t/p/original/1E5baAaEse26fej7uHcjOgEE2t2.jpg')`;

            // Event Listeners
            document.getElementById('logoBtn').onclick = resetApp;
            document.getElementById('modeMovie').onclick = () => switchMode('movie');
            document.getElementById('modeTV').onclick = () => switchMode('tv');
            document.getElementById('surpriseBtn').onclick = surpriseMe;
            document.getElementById('toggleTrailerBtn').onclick = toggleTrailer;

            window.addEventListener('resize', () => {
                const c = document.getElementById('confetti');
                if (!c) return;
                c.width = window.innerWidth;
                c.height = window.innerHeight;
            });

            // Search Listeners
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', handleSearch);
            document.getElementById('clearSearch').onclick = () => {
                searchInput.value = '';
                document.getElementById('searchResults').classList.add('hidden');
                document.getElementById('clearSearch').classList.add('hidden');
            };
        }

        function toggleTrailer() {
            const container = document.getElementById('inlineTrailerContainer');
            const icon = document.getElementById('trailerIcon');
            isTrailerExpanded = !isTrailerExpanded;
            
            if (isTrailerExpanded) {
                container.classList.add('expanded');
                icon.style.transform = 'rotate(180deg)';
            } else {
                container.classList.remove('expanded');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // --- NAVIGATION ---
        function switchMode(mode) {
            currentMode = mode;
            // Update button styles
            const activeClass = "px-3 py-1.5 rounded-full text-[10px] md:text-xs font-bold transition-all bg-rose-600 text-white shadow-lg";
            const inactiveClass = "px-3 py-1.5 rounded-full text-[10px] md:text-xs font-bold text-slate-400 hover:text-white transition-all";
            
            document.getElementById('modeMovie').className = mode === 'movie' ? activeClass : inactiveClass;
            document.getElementById('modeTV').className = mode === 'tv' ? activeClass : inactiveClass;
            document.getElementById('modeDescription').textContent = mode === 'movie' ? "Browsing Movies" : "Browsing TV Series";
            
            renderGenres();
            lucide.createIcons();
        }

        function resetApp() {
            document.getElementById('resultView').classList.add('hidden');
            // Show header/selection again
            document.getElementById('genreSelectionView').classList.remove('hidden');
            
            // Clean up
            document.getElementById('inlineTrailer').innerHTML = '';
            isTrailerExpanded = false;
            document.getElementById('inlineTrailerContainer').classList.remove('expanded');
            document.getElementById('trailerIcon').style.transform = 'rotate(0deg)';
            
            // Reset background
            document.getElementById('dynamic-bg').style.backgroundImage = `url('https://image.tmdb.org/t/p/original/1E5baAaEse26fej7uHcjOgEE2t2.jpg')`;
        }

        function renderGenres() {
            const grid = document.getElementById('genreGrid');
            grid.innerHTML = '';
            const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;

            Object.entries(GENRES).forEach(([name, data]) => {
                const btn = document.createElement('button');
                btn.className = "group relative h-20 md:h-24 bg-slate-800/50 hover:bg-rose-600 rounded-xl border border-white/5 transition-all overflow-hidden flex flex-col items-center justify-center gap-1 active:scale-95";
                
                let iconEl;
                if(data.icon === 'sword') iconEl = '<i data-lucide="sword" class="w-5 h-5 md:w-6 md:h-6 text-slate-400 group-hover:text-white transition-colors"></i>';
                else if(data.icon === 'ghost') iconEl = '<div class="text-xl md:text-2xl group-hover:scale-110 transition-transform">👻</div>';
                else iconEl = `<i data-lucide="${data.icon}" class="w-5 h-5 md:w-6 md:h-6 text-slate-400 group-hover:text-white transition-colors"></i>`;

                btn.innerHTML = `
                    <div class="z-10 flex flex-col items-center gap-1">
                        ${iconEl}
                        <span class="text-[10px] md:text-xs font-bold text-slate-300 group-hover:text-white">${name}</span>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                `;
                btn.onclick = () => fetchContent(data.id);
                grid.appendChild(btn);
            });
        }

        // --- SEARCH LOGIC ---
        function handleSearch(e) {
            const query = e.target.value.trim();
            const resultsDiv = document.getElementById('searchResults');
            const clearBtn = document.getElementById('clearSearch');
            
            if(query.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            if (searchTimeout) clearTimeout(searchTimeout);
            
            if (query.length < 2) {
                resultsDiv.classList.add('hidden');
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`);
                    const data = await res.json();
                    
                    if (data.results && data.results.length > 0) {
                        resultsDiv.innerHTML = '';
                        resultsDiv.classList.remove('hidden');
                        
                        const filtered = data.results.filter(item => item.media_type === 'movie' || item.media_type === 'tv').slice(0, 8);

                        if(filtered.length === 0) {
                             resultsDiv.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">No results found</div>';
                             return;
                        }

                        filtered.forEach(item => {
                            if(!item.poster_path && !item.backdrop_path) return;
                            
                            const div = document.createElement('div');
                            div.className = "flex items-center gap-3 p-3 hover:bg-white/10 cursor-pointer border-b border-white/5 last:border-0 transition-colors";
                            const img = item.poster_path ? `${POSTER_URL}${item.poster_path}` : 'https://via.placeholder.com/50x75?text=No+Img';
                            const title = item.title || item.name;
                            const year = (item.release_date || item.first_air_date || '').split('-')[0];
                            const type = item.media_type === 'movie' ? 'Movie' : 'TV';
                            
                            div.innerHTML = `
                                <img src="${img}" class="w-10 h-14 object-cover rounded shadow-md bg-slate-800 flex-shrink-0">
                                <div class="flex flex-col text-left overflow-hidden">
                                    <span class="text-sm font-bold text-white leading-tight mb-0.5 truncate">${title}</span>
                                    <div class="flex items-center gap-2 text-[10px] text-slate-400">
                                        <span class="uppercase tracking-wider font-semibold text-rose-400">${type}</span>
                                        <span>${year}</span>
                                    </div>
                                </div>
                            `;
                            div.onclick = () => {
                                switchMode(item.media_type);
                                loadItemDetails(item.id);
                                document.getElementById('searchInput').value = '';
                                resultsDiv.classList.add('hidden');
                            };
                            resultsDiv.appendChild(div);
                        });
                    } else {
                        resultsDiv.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">No results found</div>';
                        resultsDiv.classList.remove('hidden');
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 300); 
        }

        // --- FETCH LOGIC ---
        function surpriseMe() {
            fireConfetti();
            const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;
            const keys = Object.values(GENRES);
            const random = keys[Math.floor(Math.random() * keys.length)];
            fetchContent(random.id);
        }

        async function fetchContent(genreId) {
            showLoading(true);
            try {
                const year = document.getElementById('decadeFilter').value;
                const lang = document.getElementById('languageFilter').value;
                const sort = document.getElementById('sortFilter').value;
                const runtime = document.getElementById('runtimeFilter').value;
                
                let params = `&with_genres=${genreId}&sort_by=${sort}&vote_count.gte=100`;
                if(lang) params += `&with_original_language=${lang}`;
                
                const dateKey = currentMode === 'movie' ? 'primary_release_date' : 'first_air_date';
                if(year === '2024') params += `&${dateKey}.gte=2024-01-01`;
                else if(year === '1980') params += `&${dateKey}.gte=1980-01-01&${dateKey}.lte=1989-12-31`;
                else if(year) params += `&${dateKey}.gte=${year}-01-01&${dateKey}.lte=${parseInt(year)+9}-12-31`;

                if (runtime === 'short') params += `&with_runtime.lte=90`;
                else if (runtime === 'medium') params += `&with_runtime.gte=90&with_runtime.lte=120`;
                else if (runtime === 'long') params += `&with_runtime.gte=120`;

                // SMART PAGINATION
                const initRes = await fetch(`${BASE_URL}/discover/${currentMode}?api_key=${API_KEY}&page=1&include_adult=false${params}`);
                const initData = await initRes.json();

                if(!initData.results || initData.total_results === 0) throw new Error("No content found");

                const totalPages = Math.min(initData.total_pages, 10);
                const randomPage = Math.floor(Math.random() * totalPages) + 1;

                let results = initData.results;
                if(randomPage > 1) {
                    const pageRes = await fetch(`${BASE_URL}/discover/${currentMode}?api_key=${API_KEY}&page=${randomPage}&include_adult=false${params}`);
                    const pageData = await pageRes.json();
                    results = pageData.results;
                }

                if(!results || results.length === 0) throw new Error("No content on this page");
                
                const item = results[Math.floor(Math.random() * results.length)];
                await loadItemDetails(item.id);
                
            } catch (err) {
                console.error(err);
                showError("Nothing found. Try broadening filters.");
                showLoading(false);
            }
        }

        async function loadItemDetails(id) {
            showLoading(true);
            try {
                const res = await fetch(`${BASE_URL}/${currentMode}/${id}?api_key=${API_KEY}&append_to_response=credits,videos,watch/providers,recommendations`);
                const item = await res.json();
                
                if (!item || (item.success === false)) throw new Error("Item not found");

                currentItem = item;
                displayResult(item);
            } catch(e) {
                console.error("Load Details Error:", e);
                showError("Failed to load details. Please try again.");
                showLoading(false);
            }
        }

        // --- DISPLAY LOGIC ---
        function displayResult(item) {
            try {
                const title = item.title || item.name || "Unknown";
                const date = item.release_date || item.first_air_date || '';
                const year = date.split('-')[0] || 'N/A';
                
                // Text Content
                document.getElementById('resTitle').textContent = title;
                document.getElementById('resTagline').textContent = item.tagline || '';
                document.getElementById('resYear').textContent = year;
                document.getElementById('resRating').innerHTML = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                document.getElementById('resPlot').textContent = item.overview || "No synopsis available.";
                document.getElementById('resGenre').textContent = item.genres?.[0]?.name || 'Unknown';

                // --- SMART IMAGE SELECTION ---
                // For Mobile: Use Backdrop (Landscape) if available, falling back to poster.
                // For Desktop: Use Poster (Portrait).
                const isMobile = window.innerWidth < 768;
                const resultImg = document.getElementById('resultImage');
                
                if (isMobile && item.backdrop_path) {
                    resultImg.src = `${IMG_URL_ORIGINAL}${item.backdrop_path}`;
                    resultImg.style.objectFit = 'cover';
                } else if (item.poster_path) {
                    resultImg.src = `${IMG_URL_ORIGINAL}${item.poster_path}`;
                    resultImg.style.objectFit = isMobile ? 'contain' : 'cover'; // Contain on mobile if no backdrop to avoid cropping heads
                    if(isMobile) resultImg.style.backgroundColor = '#000';
                } else {
                    resultImg.src = 'https://via.placeholder.com/800x450?text=No+Image';
                }

                // Metadata Chips
                const metaChips = document.getElementById('metaChips');
                const extraPanel = document.getElementById('extraInfoPanel');
                metaChips.innerHTML = '';
                extraPanel.innerHTML = '';

                // Common Chips
                metaChips.innerHTML += `<div class="bg-white/10 border border-white/5 px-3 py-1.5 rounded-lg text-xs font-bold text-white uppercase tracking-wider">${item.original_language || 'EN'}</div>`;
                
                if(currentMode === 'movie') {
                    if(item.runtime) metaChips.innerHTML += `<div class="bg-white/10 border border-white/5 px-3 py-1.5 rounded-lg text-xs font-bold text-white flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${item.runtime}m</div>`;
                    
                    extraPanel.innerHTML = `
                        <div><span class="block font-bold text-slate-500 uppercase">Budget</span><span class="text-white">${item.budget > 0 ? '$'+(item.budget/1000000).toFixed(1)+'M' : '-'}</span></div>
                        <div><span class="block font-bold text-slate-500 uppercase">Revenue</span><span class="text-white">${item.revenue > 0 ? '$'+(item.revenue/1000000).toFixed(1)+'M' : '-'}</span></div>
                        <div class="col-span-2"><span class="block font-bold text-slate-500 uppercase">Studio</span><span class="text-white truncate block">${item.production_companies?.[0]?.name || '-'}</span></div>
                    `;
                } else {
                    if(item.number_of_seasons) metaChips.innerHTML += `<div class="bg-white/10 border border-white/5 px-3 py-1.5 rounded-lg text-xs font-bold text-white flex items-center gap-1"><i data-lucide="layers" class="w-3 h-3"></i> ${item.number_of_seasons} S</div>`;
                    
                    extraPanel.innerHTML = `
                        <div><span class="block font-bold text-slate-500 uppercase">First Air</span><span class="text-white">${item.first_air_date || '-'}</span></div>
                        <div><span class="block font-bold text-slate-500 uppercase">Last Air</span><span class="text-white">${item.last_air_date || '-'}</span></div>
                        <div class="col-span-2"><span class="block font-bold text-slate-500 uppercase">Network</span><span class="text-white truncate block">${item.networks?.[0]?.name || '-'}</span></div>
                    `;
                }

                // Trailer logic
                const trailer = item.videos?.results?.find(v => v.site === 'YouTube' && v.type === 'Trailer' && v.official) || item.videos?.results?.find(v => v.site === 'YouTube' && v.type === 'Trailer');
                const inlineTrailer = document.getElementById('inlineTrailer');
                const toggleBtn = document.getElementById('toggleTrailerBtn');
                
                inlineTrailer.innerHTML = '';
                isTrailerExpanded = false;
                document.getElementById('inlineTrailerContainer').classList.remove('expanded');
                document.getElementById('trailerIcon').style.transform = 'rotate(0deg)';

                if(trailer) {
                    toggleBtn.parentElement.classList.remove('hidden');
                    const embedUrl = `https://www.youtube.com/embed/${trailer.key}?autoplay=0&controls=1&rel=0`;
                    inlineTrailer.innerHTML = `<iframe src="${embedUrl}" title="Trailer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                } else {
                    toggleBtn.parentElement.classList.add('hidden');
                }

                // Providers
                const provs = item['watch/providers']?.results?.['IN'] || item['watch/providers']?.results?.['US'];
                const provArea = document.getElementById('providersArea');
                const provList = document.getElementById('providerIcons');
                provList.innerHTML = '';
                
                if(provs && (provs.flatrate || provs.buy || provs.rent)) {
                    provArea.classList.remove('hidden');
                    const methods = [...(provs.flatrate||[]), ...(provs.buy||[]), ...(provs.rent||[])];
                    const unique = new Map();
                    methods.forEach(p => unique.set(p.provider_id, p));
                    
                    Array.from(unique.values()).slice(0, 5).forEach(p => {
                        const a = document.createElement('a');
                        let searchUrl = STREAM_URLS[p.provider_name] ? `${STREAM_URLS[p.provider_name]}${encodeURIComponent(title)}` : `https://www.google.com/search?q=watch ${encodeURIComponent(title)} on ${p.provider_name}`;
                        
                        a.href = searchUrl;
                        a.target = "_blank";
                        a.innerHTML = `<img src="${IMG_URL_ORIGINAL}${p.logo_path}" class="w-10 h-10 rounded-xl shadow-md border border-white/10" title="Watch on ${p.provider_name}">`;
                        provList.appendChild(a);
                    });
                } else {
                    provArea.classList.add('hidden');
                }

                // Cast
                const castList = document.getElementById('castList');
                castList.innerHTML = '';
                (item.credits?.cast || []).slice(0, 8).forEach(c => {
                    const div = document.createElement('div');
                    div.className = "flex flex-col items-center min-w-[64px] gap-2 group/cast";
                    const img = c.profile_path ? `${PROFILE_URL}${c.profile_path}` : 'https://via.placeholder.com/100x100?text=?';
                    div.innerHTML = `
                        <a href="https://www.google.com/search?q=${encodeURIComponent(c.name)}" target="_blank" class="block w-14 h-14 rounded-full overflow-hidden border-2 border-white/10 group-hover/cast:border-rose-500 transition-all shadow-md">
                            <img src="${img}" class="w-full h-full object-cover">
                        </a>
                        <span class="text-[10px] text-slate-400 font-bold text-center truncate w-full group-hover/cast:text-white transition-colors">${c.name}</span>
                    `;
                    castList.appendChild(div);
                });

                // Stream Link
                document.getElementById('streamLink').href = `https://www.justwatch.com/in/search?q=${encodeURIComponent(title)}`;

                // Switch Views
                document.getElementById('genreSelectionView').classList.add('hidden');
                document.getElementById('resultView').classList.remove('hidden');
                lucide.createIcons();

            } catch (err) {
                console.error("Display Error:", err);
                showError("Error displaying content.");
            } finally {
                showLoading(false);
            }
        }

        // --- HELPERS ---
        function showLoading(show) {
            const el = document.getElementById('loadingView');
            if(show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function showError(msg) {
            const t = document.getElementById('errorToast');
            document.getElementById('errorText').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function shareContent() {
            if(!currentItem) return;
            const title = currentItem.title || currentItem.name;
            const text = `Check out "${title}" on WatchNext!`;
            if(navigator.share) {
                navigator.share({ title: 'WatchNext Pick', text: text });
            } else {
                navigator.clipboard.writeText(text);
                showError("Copied to clipboard!");
            }
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const particles = Array.from({length: 50}, () => ({
                x: canvas.width/2, y: canvas.height/2,
                vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
                color: `hsl(${Math.random()*360}, 100%, 50%)`,
                life: 100
            }));
            
            function animate() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                let active = false;
                particles.forEach(p => {
                    if(p.life > 0) {
                        p.x+=p.vx; p.y+=p.vy; p.vy+=0.5; p.life--;
                        ctx.fillStyle = p.color; ctx.fillRect(p.x,p.y,5,5);
                        active=true;
                    }
                });
                if(active) requestAnimationFrame(animate);
            }
            animate();
        }

        init();
    </script>
