<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WatchNext: Ultimate Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Base Setup */
        body {
            background-color: #020617; /* Slate 950 */
            color: #e2e8f0;
            overflow: hidden; /* Prevent page scrolling */
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar (Hidden but functional) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes scale-in { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .animate-fade-in { animation: fade-in 0.6s ease-out forwards; }
        .animate-slide-up { animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Glassmorphism */
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .glass-dark {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Dynamic Background */
        #dynamic-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            transform: scale(1.05);
        }
        #bg-overlay {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: linear-gradient(to top, #020617 10%, rgba(2,6,23,0.8) 50%, rgba(2,6,23,0.4) 100%);
        }

        /* Aspect Ratio Helpers */
        .aspect-video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .aspect-video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Utility */
        .hidden { display: none !important; }
        .text-shadow { text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
    </style>
</head>
<body class="flex flex-col h-screen w-full font-sans antialiased selection:bg-rose-500/30">

    <!-- Backgrounds -->
    <div id="dynamic-bg"></div>
    <div id="bg-overlay"></div>
    <canvas id="confetti" class="fixed inset-0 pointer-events-none z-[60]"></canvas>

    <!-- Header (Fixed Top) -->
    <header class="fixed top-0 left-0 right-0 z-50 px-4 py-3 md:px-6 md:py-4 flex items-center justify-between bg-gradient-to-b from-black/80 to-transparent">
        <button id="logoBtn" class="flex items-center gap-2 group focus:outline-none">
            <div class="p-1.5 bg-rose-600 rounded-lg shadow-lg shadow-rose-600/30 group-hover:scale-105 transition-transform">
                <i data-lucide="clapperboard" class="text-white w-5 h-5"></i>
            </div>
            <span class="text-xl font-black tracking-tighter text-white drop-shadow-md">
                Watch<span class="text-rose-500">Next</span>
            </span>
        </button>
        
        <div class="flex items-center bg-black/40 backdrop-blur-md p-1 rounded-full border border-white/10">
            <button id="modeMovie" class="px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-rose-600 text-white shadow-lg">Movies</button>
            <button id="modeTV" class="px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white transition-all">TV</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="relative z-10 flex-grow flex flex-col w-full h-full overflow-hidden">
        
        <!-- Error Toast -->
        <div id="errorToast" class="hidden absolute top-20 left-1/2 -translate-x-1/2 bg-red-500/90 text-white px-6 py-3 rounded-full shadow-2xl items-center gap-3 z-[100] animate-fade-in backdrop-blur-md border border-white/10">
            <i data-lucide="alert-circle" class="w-4 h-4"></i>
            <span id="errorText" class="text-sm font-medium">Error message</span>
            <button onclick="document.getElementById('errorToast').classList.add('hidden')" class="ml-2 opacity-80 hover:opacity-100">✕</button>
        </div>

        <!-- VIEW 1: SELECTION (Scrollable content area) -->
        <div id="genreSelectionView" class="w-full h-full overflow-y-auto no-scrollbar pt-20 pb-10 px-4 flex flex-col items-center">
            
            <div class="text-center mb-8 mt-4 md:mt-10 animate-fade-in">
                <h2 class="text-3xl md:text-5xl font-black text-white mb-2 text-shadow">Find your next <span class="text-rose-500">obsession</span>.</h2>
                <p id="modeDescription" class="text-slate-300 text-sm md:text-base font-medium opacity-80">Browsing Movies</p>
            </div>

            <!-- Filters Bar -->
            <div class="w-full max-w-5xl grid grid-cols-2 md:grid-cols-4 gap-2 mb-8 animate-fade-in" style="animation-delay: 0.1s">
                <div class="glass rounded-xl p-2">
                    <label class="block text-[10px] uppercase font-bold text-slate-400 px-2 mb-1">Era</label>
                    <select id="decadeFilter" class="w-full bg-transparent text-white text-sm font-medium focus:outline-none cursor-pointer">
                        <option value="" class="bg-slate-900">Any Time</option>
                        <option value="2024" class="bg-slate-900">New (2024-25)</option>
                        <option value="2020" class="bg-slate-900">2020s</option>
                        <option value="2010" class="bg-slate-900">2010s</option>
                        <option value="2000" class="bg-slate-900">2000s</option>
                        <option value="1990" class="bg-slate-900">90s Classics</option>
                        <option value="1980" class="bg-slate-900">80s Retro</option>
                    </select>
                </div>
                <div class="glass rounded-xl p-2">
                    <label class="block text-[10px] uppercase font-bold text-slate-400 px-2 mb-1">Language</label>
                    <select id="languageFilter" class="w-full bg-transparent text-white text-sm font-medium focus:outline-none cursor-pointer">
                        <option value="en" class="bg-slate-900">English</option>
                        <option value="hi" class="bg-slate-900">Hindi</option>
                        <option value="kn" class="bg-slate-900">Kannada</option>
                        <option value="ta" class="bg-slate-900">Tamil</option>
                        <option value="te" class="bg-slate-900">Telugu</option>
                        <option value="ml" class="bg-slate-900">Malayalam</option>
                        <option value="ko" class="bg-slate-900">Korean</option>
                        <option value="ja" class="bg-slate-900">Japanese</option>
                        <option value="" class="bg-slate-900">All Languages</option>
                    </select>
                </div>
                <div class="glass rounded-xl p-2">
                    <label class="block text-[10px] uppercase font-bold text-slate-400 px-2 mb-1">Sort</label>
                    <select id="sortFilter" class="w-full bg-transparent text-white text-sm font-medium focus:outline-none cursor-pointer">
                        <option value="popularity.desc" class="bg-slate-900">Popularity</option>
                        <option value="vote_average.desc" class="bg-slate-900">Top Rated</option>
                        <option value="revenue.desc" class="bg-slate-900">Box Office</option>
                        <option value="primary_release_date.desc" class="bg-slate-900">Newest First</option>
                    </select>
                </div>
                <button id="surpriseBtn" class="bg-gradient-to-br from-purple-600 to-rose-600 rounded-xl p-2 flex flex-col items-center justify-center text-white font-bold hover:scale-[1.02] transition-transform shadow-lg shadow-rose-600/20 group">
                    <i data-lucide="sparkles" class="w-4 h-4 mb-1 group-hover:animate-spin"></i>
                    <span class="text-xs">Surprise Me</span>
                </button>
            </div>

            <!-- Genre Grid -->
            <div id="genreGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 w-full max-w-6xl pb-20 animate-fade-in" style="animation-delay: 0.2s">
                <!-- Genres injected here -->
            </div>
        </div>

        <!-- VIEW 2: LOADING OVERLAY -->
        <div id="loadingView" class="hidden absolute inset-0 z-[60] bg-black/60 backdrop-blur-xl flex flex-col items-center justify-center text-center p-6">
            <div class="relative w-24 h-24 mb-6">
               <div class="absolute inset-0 rounded-full border-4 border-slate-700"></div>
               <div class="absolute inset-0 rounded-full border-t-4 border-rose-500 animate-spin"></div>
            </div>
            <h3 id="loadingText" class="text-2xl font-bold text-white mb-2">Finding the perfect pick...</h3>
            <p id="loadingSubtext" class="text-slate-400 text-sm">Searching the multiverse</p>
        </div>

        <!-- VIEW 3: RESULT (Full Screen Immersive) -->
        <div id="resultView" class="hidden absolute inset-0 z-40 flex flex-col md:flex-row h-full w-full overflow-hidden bg-black/40">
            
            <!-- Close / Back Button (Mobile) -->
            <button onclick="resetApp()" class="md:hidden absolute top-4 left-4 z-50 bg-black/50 p-2 rounded-full text-white backdrop-blur-md border border-white/10">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>

            <!-- LEFT/TOP: Visuals (Background is managed by body, this is for trailers) -->
            <div class="w-full md:w-1/2 h-[40vh] md:h-full flex items-center justify-center relative p-0 md:p-10">
                <!-- Trailer Embed Area -->
                <div id="trailerArea" class="w-full max-w-2xl aspect-video-container hidden md:block shadow-2xl border border-white/10">
                    <!-- Trailer injected here -->
                </div>
                <!-- Mobile Gradient -->
                <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent md:hidden pointer-events-none"></div>
            </div>

            <!-- RIGHT/BOTTOM: Details (Scrollable Panel) -->
            <div class="w-full md:w-1/2 h-[60vh] md:h-full bg-gradient-to-t md:bg-gradient-to-l from-black via-black/95 to-transparent flex flex-col overflow-y-auto no-scrollbar">
                
                <div class="mt-auto p-6 md:p-12 md:max-w-2xl">
                    <!-- Genre & Status -->
                    <div class="flex items-center gap-2 mb-2">
                        <span id="resGenre" class="text-[10px] md:text-xs font-bold tracking-widest text-rose-500 uppercase">Action</span>
                        <span class="w-1 h-1 rounded-full bg-slate-500"></span>
                        <span id="resYear" class="text-[10px] md:text-xs font-medium text-slate-300">2024</span>
                        <span class="w-1 h-1 rounded-full bg-slate-500"></span>
                        <span id="resRating" class="flex items-center gap-1 text-[10px] md:text-xs font-bold text-yellow-400">
                            <i data-lucide="star" class="w-3 h-3 fill-current"></i> 8.5
                        </span>
                    </div>

                    <!-- Title -->
                    <h1 id="resTitle" class="text-3xl md:text-5xl font-black text-white leading-tight mb-2 text-shadow">Movie Title</h1>
                    <p id="resTagline" class="text-sm md:text-base text-slate-400 italic mb-4 md:mb-6 font-light">"The tagline goes here"</p>

                    <!-- Mobile Play Button (Since trailer is hidden on small mobile views by default layout) -->
                    <button id="mobileTrailerBtn" class="md:hidden w-full bg-white text-black py-3 rounded-xl font-bold mb-6 flex items-center justify-center gap-2 shadow-lg" onclick="showMobileTrailer()">
                        <i data-lucide="play" class="w-4 h-4 fill-current"></i> Watch Trailer
                    </button>

                    <!-- Metadata -->
                    <div class="flex flex-wrap gap-3 mb-6">
                        <div class="glass px-3 py-1 rounded-md text-xs font-medium text-white flex items-center gap-1">
                            <i data-lucide="clock" class="w-3 h-3"></i> <span id="resRuntime">120m</span>
                        </div>
                        <div class="glass px-3 py-1 rounded-md text-xs font-medium text-white uppercase" id="resLang">EN</div>
                        <div class="glass px-3 py-1 rounded-md text-xs font-medium text-green-400" id="resStatus">Released</div>
                    </div>

                    <!-- Plot -->
                    <p id="resPlot" class="text-slate-300 text-sm md:text-base leading-relaxed mb-6 font-light opacity-90">
                        Detailed plot summary goes here...
                    </p>

                    <!-- Providers -->
                    <div id="providersArea" class="mb-6 hidden">
                        <h4 class="text-xs font-bold text-slate-500 uppercase mb-2">Stream On</h4>
                        <div id="providerIcons" class="flex flex-wrap gap-2"></div>
                    </div>

                    <!-- Cast -->
                    <div class="mb-6">
                        <h4 class="text-xs font-bold text-slate-500 uppercase mb-2">Starring</h4>
                        <div id="castList" class="flex gap-3 overflow-x-auto no-scrollbar pb-2"></div>
                    </div>

                    <!-- Recommendations -->
                    <div id="recsArea" class="mb-8 hidden">
                        <h4 class="text-xs font-bold text-slate-500 uppercase mb-2">You Might Also Like</h4>
                        <div id="recsList" class="flex gap-3 overflow-x-auto no-scrollbar pb-2"></div>
                    </div>

                    <!-- Bottom Actions (Sticky) -->
                    <div class="flex gap-3 pt-4 sticky bottom-0 bg-black/80 backdrop-blur-lg md:bg-transparent md:backdrop-filter-none pb-4 md:pb-0 z-20">
                         <button onclick="resetApp()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl font-bold transition-all border border-white/10">
                            Reject
                        </button>
                        <a id="streamLink" href="#" target="_blank" class="flex-[2] bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl font-bold transition-all shadow-lg shadow-rose-600/20 flex items-center justify-center gap-2">
                            <i data-lucide="tv" class="w-4 h-4"></i> Stream Now
                        </a>
                        <button onclick="shareContent()" class="w-12 flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-white rounded-xl border border-white/10">
                            <i data-lucide="share-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Mobile Video Modal -->
            <div id="mobileVideoModal" class="hidden absolute inset-0 z-[60] bg-black flex flex-col justify-center">
                 <button onclick="closeMobileTrailer()" class="absolute top-4 right-4 text-white p-2 bg-slate-800 rounded-full"><i data-lucide="x" class="w-6 h-6"></i></button>
                 <div class="w-full aspect-video-container">
                     <div id="mobileVideoFrame"></div>
                 </div>
            </div>

        </div>

    </main>

    <script>
        // --- CONFIG ---
        const API_KEY = "2b834d5234781ad70bd646922e9ddd18";
        const BASE_URL = "https://api.themoviedb.org/3";
        const IMG_URL = "https://image.tmdb.org/t/p/original";
        const POSTER_URL = "https://image.tmdb.org/t/p/w500";
        const PROFILE_URL = "https://image.tmdb.org/t/p/w185";

        const STREAM_URLS = {
            'Netflix': 'https://www.netflix.com/search?q=',
            'Amazon Prime Video': 'https://www.primevideo.com/search/ref=atv_nb_sr?phrase=',
            'Disney Plus': 'https://www.disneyplus.com/search?q=',
            'Hotstar': 'https://www.hotstar.com/in/explore?q=',
            'Hulu': 'https://www.hulu.com/search?q=',
            'YouTube': 'https://www.youtube.com/results?search_query=',
            'JioCinema': 'https://www.jiocinema.com/search/',
            'Zee5': 'https://www.zee5.com/search?q=',
            'SonyLIV': 'https://www.sonyliv.com/search/'
        };

        const MOVIE_GENRES = {
            'Action': {id:28, icon:'sword'}, 'Adventure':{id:12, icon:'map'}, 'Animation':{id:16, icon:'palette'},
            'Comedy':{id:35, icon:'smile'}, 'Crime':{id:80, icon:'siren'}, 'Documentary':{id:99, icon:'file-text'},
            'Drama':{id:18, icon:'drama'}, 'Family':{id:10751, icon:'home'}, 'Fantasy':{id:14, icon:'wand'},
            'History':{id:36, icon:'hourglass'}, 'Horror':{id:27, icon:'ghost'}, 'Music':{id:10402, icon:'music'},
            'Mystery':{id:9648, icon:'search'}, 'Romance':{id:10749, icon:'heart'}, 'Sci-Fi':{id:878, icon:'rocket'},
            'Thriller':{id:53, icon:'eye'}, 'War':{id:10752, icon:'shield'}
        };

        const TV_GENRES = {
            'Action & Adv':{id:10759, icon:'sword'}, 'Animation':{id:16, icon:'palette'}, 'Comedy':{id:35, icon:'smile'},
            'Crime':{id:80, icon:'siren'}, 'Documentary':{id:99, icon:'file-text'}, 'Drama':{id:18, icon:'drama'},
            'Family':{id:10751, icon:'home'}, 'Kids':{id:10762, icon:'baby'}, 'Mystery':{id:9648, icon:'search'},
            'News':{id:10763, icon:'mic'}, 'Reality':{id:10764, icon:'video'}, 'Sci-Fi & Fantasy':{id:10765, icon:'rocket'},
            'Soap':{id:10766, icon:'coffee'}, 'Talk':{id:10767, icon:'mic-2'}, 'War & Politics':{id:10768, icon:'shield'}
        };

        // --- STATE ---
        let currentMode = 'movie'; // 'movie' or 'tv'
        let currentItem = null;
        let currentTrailerKey = null;

        // --- INIT ---
        function init() {
            renderGenres();
            lucide.createIcons();
            
            // Initial Background
            document.getElementById('dynamic-bg').style.backgroundImage = `url('https://image.tmdb.org/t/p/original/1E5baAaEse26fej7uHcjOgEE2t2.jpg')`;

            // Event Listeners
            document.getElementById('logoBtn').onclick = resetApp;
            document.getElementById('modeMovie').onclick = () => switchMode('movie');
            document.getElementById('modeTV').onclick = () => switchMode('tv');
            document.getElementById('surpriseBtn').onclick = surpriseMe;
        }

        // --- NAVIGATION ---
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('modeMovie').className = mode === 'movie' ? "px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-rose-600 text-white shadow-lg" : "px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white transition-all";
            document.getElementById('modeTV').className = mode === 'tv' ? "px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-rose-600 text-white shadow-lg" : "px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white transition-all";
            document.getElementById('modeDescription').textContent = mode === 'movie' ? "Browsing Movies" : "Browsing TV Series";
            renderGenres();
            lucide.createIcons();
        }

        function resetApp() {
            document.getElementById('resultView').classList.add('hidden');
            document.getElementById('genreSelectionView').classList.remove('hidden');
            document.getElementById('trailerArea').innerHTML = '';
            document.getElementById('dynamic-bg').style.backgroundImage = `url('https://image.tmdb.org/t/p/original/1E5baAaEse26fej7uHcjOgEE2t2.jpg')`;
        }

        function renderGenres() {
            const grid = document.getElementById('genreGrid');
            grid.innerHTML = '';
            const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;

            Object.entries(GENRES).forEach(([name, data]) => {
                const btn = document.createElement('button');
                btn.className = "group relative h-24 bg-slate-800/50 hover:bg-rose-600 rounded-xl border border-white/5 transition-all overflow-hidden flex flex-col items-center justify-center gap-1 active:scale-95";
                
                // Icon handling
                let iconEl;
                if(data.icon === 'sword') iconEl = '<i data-lucide="sword" class="w-6 h-6 text-slate-400 group-hover:text-white transition-colors"></i>';
                else if(data.icon === 'ghost') iconEl = '<div class="text-2xl group-hover:scale-110 transition-transform">👻</div>';
                else iconEl = `<i data-lucide="${data.icon}" class="w-6 h-6 text-slate-400 group-hover:text-white transition-colors"></i>`;

                btn.innerHTML = `
                    <div class="z-10 flex flex-col items-center gap-1">
                        ${iconEl}
                        <span class="text-xs font-bold text-slate-300 group-hover:text-white">${name}</span>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                `;
                btn.onclick = () => fetchContent(data.id);
                grid.appendChild(btn);
            });
        }

        // --- FETCH LOGIC ---
        function surpriseMe() {
            fireConfetti();
            const GENRES = currentMode === 'movie' ? MOVIE_GENRES : TV_GENRES;
            const keys = Object.values(GENRES);
            const random = keys[Math.floor(Math.random() * keys.length)];
            fetchContent(random.id);
        }

        async function fetchContent(genreId) {
            showLoading(true);
            try {
                // Filters
                const year = document.getElementById('decadeFilter').value;
                const lang = document.getElementById('languageFilter').value;
                const sort = document.getElementById('sortFilter').value;
                
                let params = `&with_genres=${genreId}&sort_by=${sort}&vote_count.gte=100`;
                if(lang) params += `&with_original_language=${lang}`;
                
                // Date logic
                const dateKey = currentMode === 'movie' ? 'primary_release_date' : 'first_air_date';
                if(year === '2024') params += `&${dateKey}.gte=2024-01-01`;
                else if(year === '1980') params += `&${dateKey}.gte=1980-01-01&${dateKey}.lte=1989-12-31`;
                else if(year) params += `&${dateKey}.gte=${year}-01-01&${dateKey}.lte=${parseInt(year)+9}-12-31`;

                // Discover
                const randomPage = Math.floor(Math.random() * 10) + 1;
                const res = await fetch(`${BASE_URL}/discover/${currentMode}?api_key=${API_KEY}&page=${randomPage}&include_adult=false${params}`);
                const data = await res.json();
                
                if(!data.results?.length) throw new Error("No content found");
                const item = data.results[Math.floor(Math.random() * data.results.length)];
                
                await loadItemDetails(item.id);
                
            } catch (err) {
                console.error(err);
                showError("Nothing found. Try different filters.");
                showLoading(false);
            }
        }

        async function loadItemDetails(id) {
            try {
                const res = await fetch(`${BASE_URL}/${currentMode}/${id}?api_key=${API_KEY}&append_to_response=credits,videos,watch/providers,recommendations`);
                const item = await res.json();
                currentItem = item;
                displayResult(item);
            } catch(e) {
                showError("Failed to load details");
                showLoading(false);
            }
        }

        // --- DISPLAY LOGIC ---
        function displayResult(item) {
            const title = item.title || item.name;
            const date = item.release_date || item.first_air_date || '';
            const year = date.split('-')[0];
            const runtime = item.runtime || (item.episode_run_time?.[0]) || '?';
            
            // Text Content
            document.getElementById('resTitle').textContent = title;
            document.getElementById('resTagline').textContent = item.tagline || '';
            document.getElementById('resYear').textContent = year;
            document.getElementById('resRating').innerHTML = `<i data-lucide="star" class="w-3 h-3 fill-current text-yellow-400"></i> ${item.vote_average.toFixed(1)}`;
            document.getElementById('resRuntime').textContent = `${runtime} min`;
            document.getElementById('resLang').textContent = (item.original_language || 'en').toUpperCase();
            document.getElementById('resPlot').textContent = item.overview;
            document.getElementById('resGenre').textContent = item.genres?.[0]?.name || 'Unknown';
            document.getElementById('resStatus').textContent = item.status;

            // Background
            if(item.poster_path || item.backdrop_path) {
                const bgPath = item.backdrop_path || item.poster_path;
                document.getElementById('dynamic-bg').style.backgroundImage = `url('${IMG_URL}${bgPath}')`;
            }

            // Trailer
            const trailer = item.videos?.results?.find(v => v.site === 'YouTube' && v.type === 'Trailer');
            const trailerArea = document.getElementById('trailerArea');
            if(trailer) {
                currentTrailerKey = trailer.key;
                // Simple embed to fix Error 153. No enablejsapi, simple standard embed.
                const embedUrl = `https://www.youtube.com/embed/${trailer.key}?autoplay=1&mute=1&controls=1&modestbranding=1&rel=0`;
                trailerArea.innerHTML = `<iframe src="${embedUrl}" title="Trailer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                document.getElementById('mobileTrailerBtn').classList.remove('hidden');
            } else {
                currentTrailerKey = null;
                trailerArea.innerHTML = `<div class="w-full h-full flex items-center justify-center text-slate-500 glass"><p>No Trailer Available</p></div>`;
                document.getElementById('mobileTrailerBtn').classList.add('hidden');
            }

            // Providers
            const provs = item['watch/providers']?.results?.['IN'] || item['watch/providers']?.results?.['US'];
            const provArea = document.getElementById('providersArea');
            const provList = document.getElementById('providerIcons');
            provList.innerHTML = '';
            
            if(provs && (provs.flatrate || provs.buy || provs.rent)) {
                provArea.classList.remove('hidden');
                const methods = [...(provs.flatrate||[]), ...(provs.buy||[]), ...(provs.rent||[])];
                // Unique
                const unique = new Map();
                methods.forEach(p => unique.set(p.provider_id, p));
                
                Array.from(unique.values()).slice(0, 5).forEach(p => {
                    const a = document.createElement('a');
                    const searchUrl = STREAM_URLS[p.provider_name] ? `${STREAM_URLS[p.provider_name]}${encodeURIComponent(title)}` : `https://www.google.com/search?q=watch ${encodeURIComponent(title)} ${p.provider_name}`;
                    a.href = searchUrl;
                    a.target = "_blank";
                    a.innerHTML = `<img src="https://image.tmdb.org/t/p/original${p.logo_path}" class="w-10 h-10 rounded-lg shadow-md hover:scale-110 transition-transform cursor-pointer" title="${p.provider_name}">`;
                    provList.appendChild(a);
                });
            } else {
                provArea.classList.add('hidden');
            }

            // Cast
            const castList = document.getElementById('castList');
            castList.innerHTML = '';
            (item.credits?.cast || []).slice(0, 8).forEach(c => {
               const div = document.createElement('div');
               div.className = "flex flex-col items-center min-w-[60px] gap-1";
               const img = c.profile_path ? `${PROFILE_URL}${c.profile_path}` : 'https://via.placeholder.com/100x100?text=?';
               div.innerHTML = `
                   <a href="https://www.google.com/search?q=${encodeURIComponent(c.name)}" target="_blank">
                    <img src="${img}" class="w-12 h-12 rounded-full object-cover border border-white/10 hover:border-rose-500 transition-colors shadow-sm">
                   </a>
                   <span class="text-[10px] text-slate-400 text-center truncate w-full">${c.name}</span>
               `;
               castList.appendChild(div);
            });

            // Recommendations (In-App Click)
            const recs = item.recommendations?.results || [];
            const recsArea = document.getElementById('recsArea');
            const recsList = document.getElementById('recsList');
            recsList.innerHTML = '';
            
            if(recs.length > 0) {
                recsArea.classList.remove('hidden');
                recs.slice(0, 8).forEach(r => {
                    if(!r.poster_path) return;
                    const div = document.createElement('div');
                    div.className = "relative min-w-[80px] h-[120px] rounded-lg overflow-hidden cursor-pointer hover:scale-105 transition-transform border border-white/10";
                    div.innerHTML = `<img src="${POSTER_URL}${r.poster_path}" class="w-full h-full object-cover">`;
                    // RECURSIVE LOAD
                    div.onclick = () => {
                        showLoading(true);
                        // Small timeout to allow UI to show loading state
                        setTimeout(() => loadItemDetails(r.id), 100);
                    };
                    recsList.appendChild(div);
                });
            } else {
                recsArea.classList.add('hidden');
            }

            // Stream Button
            document.getElementById('streamLink').href = `https://www.justwatch.com/in/search?q=${encodeURIComponent(title)}`;

            // Switch Views
            showLoading(false);
            document.getElementById('genreSelectionView').classList.add('hidden');
            document.getElementById('resultView').classList.remove('hidden');
            lucide.createIcons();
        }

        // --- HELPERS ---
        function showLoading(show) {
            const el = document.getElementById('loadingView');
            if(show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function showError(msg) {
            const t = document.getElementById('errorToast');
            document.getElementById('errorText').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function shareContent() {
            if(!currentItem) return;
            const title = currentItem.title || currentItem.name;
            const text = `Check out "${title}" on WatchNext!`;
            if(navigator.share) {
                navigator.share({ title: 'WatchNext Pick', text: text });
            } else {
                navigator.clipboard.writeText(text);
                showError("Copied to clipboard!");
            }
        }

        // Mobile Video Logic
        function showMobileTrailer() {
            if(!currentTrailerKey) return;
            const modal = document.getElementById('mobileVideoModal');
            const frame = document.getElementById('mobileVideoFrame');
            frame.innerHTML = `<iframe src="https://www.youtube.com/embed/${currentTrailerKey}?autoplay=1&controls=1" class="w-full h-full" frameborder="0" allowfullscreen></iframe>`;
            modal.classList.remove('hidden');
        }
        function closeMobileTrailer() {
            document.getElementById('mobileVideoModal').classList.add('hidden');
            document.getElementById('mobileVideoFrame').innerHTML = '';
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const particles = Array.from({length: 50}, () => ({
                x: canvas.width/2, y: canvas.height/2,
                vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
                color: `hsl(${Math.random()*360}, 100%, 50%)`,
                life: 100
            }));
            
            function animate() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                let active = false;
                particles.forEach(p => {
                    if(p.life > 0) {
                        p.x+=p.vx; p.y+=p.vy; p.vy+=0.5; p.life--;
                        ctx.fillStyle = p.color; ctx.fillRect(p.x,p.y,5,5);
                        active=true;
                    }
                });
                if(active) requestAnimationFrame(animate);
            }
            animate();
        }

        init();
    </script>
</body>
</html>
